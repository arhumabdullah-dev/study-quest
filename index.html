<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>学习闯关</title>
<link rel="manifest" href="study.webmanifest">
<link rel="icon" type="image/png" href="icons/study-192.png">
<link rel="apple-touch-icon" href="icons/study-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="学习闯关">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#bfe6ff">
<style>
/* A little game room: 安仁 stands in the middle of a sky-blue room on a warm floor,
   chunky "candy" buttons with a pressed-down edge, one task card at the bottom. */
:root{
  --sky1:#aee0ff; --sky2:#e6f6ff; --floor1:#ffe3bd; --floor2:#ffcf94;
  --sheet:#ffffff; --paper:#eef8ff; --ink:#25304b; --pencil:#7781a0; --rule:#e2e8f3; --shade:rgba(37,48,75,.16);
  --sun:#ffc21f; --sun-e:#e59a00; --go:#36c66b; --go-e:#1f9a4d; --pink:#ff6f9f; --pink-e:#de4b7f;
  --red:#ff5d50; --red-e:#d23b2f; --blue:#3b8cff; --blue-e:#2367d4; --on:#ffffff; --on-sun:#4a2c00;
  --blue-ink:#ffffff; --seal:#ff5d50; --hl:#ffe36e; --hl-soft:#fff0a8; --good:#1f9a4d; --danger:#e23d31;
  --bubble:#ffffff; --bubble-ink:#25304b; --locked:#d5dbe7;
  --c-english:#3b8cff; --c-class:#8b5cf6; --c-study:#14a895; --c-sport:#ff8a2a; --c-rest:#8a94a6; --c-life:#ff5f9e;
  --f-body:ui-rounded,"SF Pro Rounded","PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,"Segoe UI",sans-serif;
  --f-num:ui-rounded,"SF Pro Rounded",-apple-system,"Segoe UI",sans-serif;
  --navh:78px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --sky1:#18214a; --sky2:#2a3470; --floor1:#3d3166; --floor2:#2b2350;
    --sheet:#232b4d; --paper:#1b2244; --ink:#eef1ff; --pencil:#a6aed0; --rule:#38426e; --shade:rgba(0,0,0,.35);
    --sun:#ffc21f; --sun-e:#c98400; --go:#36c66b; --go-e:#1b7d3f; --pink:#ff6f9f; --pink-e:#b93a68;
    --red:#ff6a5e; --red-e:#b8352b; --blue:#5b9dff; --blue-e:#2e5fb8; --on:#ffffff; --on-sun:#3b2300;
    --blue-ink:#ffffff; --seal:#ff6a5e; --hl:#e8c547; --hl-soft:rgba(232,197,71,.3); --good:#5ad48a; --danger:#ff6a5e;
    --bubble:#ffffff; --bubble-ink:#25304b; --locked:#3a4470;
    --c-english:#6ea8ff; --c-class:#a88bf0; --c-study:#3cc2ad; --c-sport:#ffa055; --c-rest:#a2acb9; --c-life:#ff86b6;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --sky1:#18214a; --sky2:#2a3470; --floor1:#3d3166; --floor2:#2b2350;
  --sheet:#232b4d; --paper:#1b2244; --ink:#eef1ff; --pencil:#a6aed0; --rule:#38426e; --shade:rgba(0,0,0,.35);
  --sun:#ffc21f; --sun-e:#c98400; --go:#36c66b; --go-e:#1b7d3f; --pink:#ff6f9f; --pink-e:#b93a68;
  --red:#ff6a5e; --red-e:#b8352b; --blue:#5b9dff; --blue-e:#2e5fb8; --on:#ffffff; --on-sun:#3b2300;
  --blue-ink:#ffffff; --seal:#ff6a5e; --hl:#e8c547; --hl-soft:rgba(232,197,71,.3); --good:#5ad48a; --danger:#ff6a5e;
  --bubble:#ffffff; --bubble-ink:#25304b; --locked:#3a4470;
  --c-english:#6ea8ff; --c-class:#a88bf0; --c-study:#3cc2ad; --c-sport:#ffa055; --c-rest:#a2acb9; --c-life:#ff86b6;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--sky2);background-image:linear-gradient(180deg,var(--sky1),var(--sky2) 70%);background-attachment:fixed;
  color:var(--ink);font:15px/1.45 var(--f-body);min-height:100vh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:2px solid var(--rule);border-radius:14px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--blue);outline:0}
.wrap{max-width:560px;margin:0 auto;padding-top:max(10px,env(safe-area-inset-top));padding-bottom:calc(var(--navh) + 24px + env(safe-area-inset-bottom));
  padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
body.wide .wrap{max-width:1100px}
body.home .wrap{padding-bottom:calc(var(--navh) + 8px + env(safe-area-inset-bottom))}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--pencil)}
.hint{font-size:12px;color:var(--pencil);margin-top:6px}
.spacer{flex:1}
.icon{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* chunky candy buttons: colour + a darker edge that the button sinks into when pressed */
.c3d{--b:var(--sun);--e:var(--sun-e);--t:var(--on-sun);background:var(--b);color:var(--t);border:0;border-radius:16px;box-shadow:0 5px 0 var(--e);
  font-weight:800;padding:11px 18px;transition:transform .08s,box-shadow .08s}
.c3d:active{transform:translateY(4px);box-shadow:0 1px 0 var(--e)}
.c3d.go{--b:var(--go);--e:var(--go-e);--t:var(--on)}
.c3d.pink{--b:var(--pink);--e:var(--pink-e);--t:var(--on)}
.c3d.red{--b:var(--red);--e:var(--red-e);--t:var(--on)}
.c3d.blue{--b:var(--blue);--e:var(--blue-e);--t:var(--on)}
.primary{background:var(--blue);color:var(--on);border:0;border-radius:14px;box-shadow:0 4px 0 var(--blue-e);padding:10px 16px;font-weight:800}
.primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--blue-e)}
.ghost{background:var(--sheet);border:2px solid var(--rule);border-radius:14px;padding:9px 14px;font-weight:700}
.ghost:active{transform:translateY(1px)}
.ghost:disabled{opacity:.4;cursor:default}
.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--rule))}
.card{background:var(--sheet);border-radius:24px;box-shadow:0 6px 0 var(--shade)}

/* HUD: her photo, level, XP, streak */
.hud{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;gap:7px;align-items:center;background:var(--sheet);border-radius:22px;padding:8px 10px 8px 8px;box-shadow:0 5px 0 var(--shade)}
.ava{width:50px;height:50px;border-radius:50%;border:3px solid var(--sun);padding:0;overflow:hidden;background:var(--sun);display:grid;place-items:center;font:800 22px var(--f-body);color:var(--on-sun)}
.ava img{width:100%;height:100%;object-fit:cover;display:block}
.hname{display:flex;align-items:center;gap:6px;font-weight:800;font-size:16px;min-width:0}
.hname span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv{flex:none;background:var(--blue);color:var(--on);font:800 12px/1 var(--f-num);padding:4px 7px;border-radius:999px}
.xpbar{position:relative;height:16px;margin-top:5px;background:var(--paper);border-radius:999px;overflow:hidden;box-shadow:inset 0 2px 0 var(--shade)}
.xpbar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(180deg,#ffe066,var(--sun));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.xpbar span{position:absolute;inset:0;display:grid;place-items:center;font:800 10px/1 var(--f-num);color:var(--ink)}
.chip{display:flex;align-items:center;gap:2px;background:var(--paper);border:0;border-radius:999px;padding:0 9px;min-height:44px;font:800 15px var(--f-num);color:var(--ink)}
.chip svg{width:18px;height:18px}
.chip small{font-size:11px;font-weight:800;color:var(--pencil)}
.gear{width:44px;height:44px;border-radius:50%;border:0;background:var(--paper);display:grid;place-items:center;color:var(--ink);padding:0}
.gear.q{font:900 21px/1 var(--f-body);background:var(--sun);color:var(--on-sun);box-shadow:0 3px 0 var(--sun-e)}

/* home: the room */
.home{display:flex;flex-direction:column;gap:10px;margin-top:10px;
  min-height:calc(100vh - var(--navh) - 100px - max(10px,env(safe-area-inset-top)) - env(safe-area-inset-bottom));
  min-height:calc(100dvh - var(--navh) - 100px - max(10px,env(safe-area-inset-top)) - env(safe-area-inset-bottom))}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.meter{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--ink);white-space:nowrap}
.meter .track{flex:1;height:14px}
.home.setup #nowcard{order:-1}
.roomhint{margin:-4px 2px 0;font-size:12px;font-weight:700;color:var(--ink);opacity:.75;text-align:center;line-height:1.35}
.track{height:12px;background:color-mix(in srgb,var(--sheet) 70%,transparent);border-radius:999px;overflow:hidden}
.track i{display:block;height:100%;border-radius:999px;background:var(--cc,var(--blue));transition:width .5s}
.room{position:relative;flex:1;min-height:330px;display:grid;grid-template-columns:62px minmax(0,1fr) 62px;align-items:end;
  border-radius:28px;overflow:hidden;
  background:radial-gradient(120% 34% at 50% 100%,var(--floor2) 0 55%,transparent 56%),radial-gradient(150% 40% at 50% 104%,var(--floor1) 0 60%,transparent 61%)}
/* bubble sits just above his head; on short rooms it stops 8px below the top (94px = 4 lines max) */
.bubble{position:absolute;left:50%;bottom:min(calc(var(--H) + 16px),calc(100% - 102px));transform:translateX(-50%);z-index:3;width:max-content;max-width:min(calc(100% - 128px),320px);background:var(--bubble);color:var(--bubble-ink);
  border-radius:20px;padding:9px 13px;cursor:pointer;font-weight:700;font-size:14px;line-height:1.35;text-align:center;box-shadow:0 4px 0 var(--shade);animation:pop .3s cubic-bezier(.3,1.5,.5,1);
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden}
.tapme{position:absolute;left:50%;bottom:34%;transform:translateX(-50%);z-index:3;pointer-events:none;white-space:nowrap;background:var(--sun);color:var(--on-sun);
  font-weight:900;font-size:14px;padding:6px 12px;border-radius:999px;box-shadow:0 3px 0 var(--sun-e);animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(-50%) translateY(-6px)}}
.bubble::after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-9px;border:9px solid transparent;border-bottom:0;border-top-color:var(--bubble)}
@keyframes pop{from{transform:translateX(-50%) scale(.7);opacity:0}}
.side{display:flex;flex-direction:column;gap:14px;align-items:center;padding-bottom:18px;z-index:2}
.rbtn{width:60px;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;padding:0;font-size:12px;font-weight:800;color:var(--ink)}
.rbtn span{background:var(--sheet);color:var(--ink);border-radius:999px;padding:1px 7px;white-space:nowrap;box-shadow:0 2px 0 var(--shade)}
.nametag{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);z-index:3;display:flex;align-items:center;gap:6px;min-height:40px;white-space:nowrap;
  border:0;border-radius:999px;background:var(--sheet);color:var(--ink);font-weight:900;font-size:15px;padding:4px 8px 4px 14px;box-shadow:0 4px 0 var(--shade);max-width:100%}
.nametag span{overflow:hidden;text-overflow:ellipsis}
.nametag i{font-style:normal;font-size:13px;width:28px;height:28px;border-radius:50%;background:var(--paper);display:grid;place-items:center;flex:none}
.rbtn b{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:27px;background:var(--sheet);box-shadow:0 5px 0 var(--shade);transition:transform .08s,box-shadow .08s}
.rbtn:active b{transform:translateY(4px);box-shadow:0 1px 0 var(--shade)}
.rbtn.hit b{background:var(--red);box-shadow:0 5px 0 var(--red-e)}
.rbtn.hit span{color:var(--danger)}
.rbtn.love b{background:var(--pink);box-shadow:0 5px 0 var(--pink-e)}
.room{--H:min(42vh,400px,calc((100vw - 152px) / .95))}
@supports (height:1dvh){.room{--H:min(40dvh,400px,calc((100vw - 152px) / .95))}}
.charwrap{position:relative;align-self:end;display:flex;justify-content:center;padding-top:80px}
.duo{display:flex;align-items:flex-end;justify-content:center}
.who{position:relative;z-index:1}
.who.herw{z-index:0;margin-right:calc(var(--H) * -.17)}
.pet{position:relative;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;display:flex;justify-content:center}
.pet img{display:block;height:var(--H);max-width:none;object-fit:contain;transform-origin:50% 100%;pointer-events:none;
  filter:drop-shadow(0 8px 6px rgba(60,40,10,.18))}
.pet.idle img{animation:bob 2.8s ease-in-out infinite}
.pet.her img{height:calc(var(--H) * .82)}
.pet.her.idle img{animation-delay:-1.4s}
.pet.hit img{animation:squash .5s ease}
.pet.eat img{animation:chew .3s ease 4}
.pet.love img{animation:wiggle .45s ease 3}
.pet.angry img{animation:shake .4s ease 2}
.pet.hop img{animation:hop .5s cubic-bezier(.3,1.4,.5,1)}
@keyframes bob{50%{transform:translateY(-6px) scale(1.01,.995)}}
@keyframes squash{25%{transform:scale(1.12,.8)}55%{transform:scale(.95,1.06) rotate(-3deg)}80%{transform:scale(1.02,.98) rotate(1deg)}}
@keyframes chew{50%{transform:scale(1.03,.97)}}
@keyframes wiggle{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes hop{40%{transform:translateY(-22px)}}
#petfx{position:absolute;inset:0;pointer-events:none}
.fxe{position:absolute;font-size:34px;pointer-events:none;animation:floatUp 1.3s ease-out forwards}
@keyframes floatUp{0%{opacity:0;transform:translateY(20px) scale(.6)}20%{opacity:1;transform:translateY(0) scale(1.15)}100%{opacity:0;transform:translateY(-110px)}}
.foods{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:4;display:flex;gap:6px;background:var(--sheet);border-radius:999px;padding:7px;box-shadow:0 5px 0 var(--shade);animation:pop .25s ease}
.foods button{font-size:26px;width:46px;height:46px;border-radius:50%;border:0;background:var(--paper);padding:0}
.foods button:active{transform:scale(.9)}

/* the one task card */
.nowcard{padding:14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center}
.nowcard .lab{font-size:12px;font-weight:800;color:var(--pencil);display:flex;align-items:center;gap:6px}
.nowcard .lab i{width:9px;height:9px;border-radius:50%;background:var(--cc,var(--blue))}
.nowcard .lab .live{background:var(--red);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.nowcard h3{margin:2px 0 0;font-size:20px;line-height:1.2;font-weight:900;overflow-wrap:anywhere}
.nowcard .tm{font:700 13px var(--f-num);color:var(--pencil)}
.nowcard .big{font-size:18px;padding:14px 20px;border-radius:18px;min-width:96px}
.donebox{display:flex;flex-direction:column;align-items:center;gap:7px}
.donebox small{font-size:11px;font-weight:800;color:var(--pencil);white-space:nowrap}
.nowcard.solo{grid-template-columns:minmax(0,1fr);text-align:center}
.nowcard.solo h3{font-size:19px}
.nowcard.solo p{margin:4px 0 6px;font-size:14px;font-weight:600;color:var(--pencil)}
.nowcard.solo .big{width:100%}
.nowcard.solo .ghost{width:100%;min-height:46px}
.nowfoot{grid-column:1/-1;display:flex;align-items:center;gap:8px;border-top:2px dashed var(--rule);padding-top:10px;margin-top:4px}
.pips{display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:0}
.pips i{width:12px;height:12px;border-radius:50%;background:var(--rule)}
.pips i.on{background:var(--go)}
.linkbtn{border:0;background:none;color:var(--blue);font-weight:800;padding:6px 2px;flex:none}

/* bottom nav: four big round buttons */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sheet);border-radius:26px 26px 0 0;box-shadow:0 -4px 0 var(--shade);
  padding:8px max(10px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:0;font-size:12px;font-weight:800;color:var(--pencil);min-height:56px}
.tab b{width:46px;height:40px;border-radius:16px;display:grid;place-items:center;transition:transform .15s}
.tab.on{color:var(--ink)}
.tab.on b{background:var(--sun);color:var(--on-sun);box-shadow:0 4px 0 var(--sun-e);transform:translateY(-2px)}
#addBtn{position:fixed;z-index:31;right:max(16px,calc(50vw - 264px),env(safe-area-inset-right));bottom:calc(var(--navh) + 22px + env(safe-area-inset-bottom));
  height:56px;border-radius:999px;font:900 18px/1 var(--f-body);display:flex;align-items:center;gap:6px;padding:0 20px 0 16px}
#addBtn b{font-size:28px;line-height:1}
body.weektab .wrap{padding-bottom:calc(var(--navh) + 100px + env(safe-area-inset-bottom))}

/* section titles */
.sec-title{font:900 19px var(--f-body);margin:22px 4px 10px;display:flex;align-items:baseline;gap:8px}
.sec-title small{font:700 12px var(--f-num);color:var(--pencil)}
.sec-sub{margin:-6px 4px 10px;font-size:13px;font-weight:600;color:var(--pencil);line-height:1.4}
.helpline{background:var(--sheet);border-radius:16px;padding:9px 12px;margin:0 0 12px;font-size:13px;font-weight:700;color:var(--ink);line-height:1.45;box-shadow:0 3px 0 var(--shade)}
.helpline b{color:var(--good)}
.intro{padding:14px 16px;margin-top:14px}
.intro h3{margin:0 0 2px;font:900 18px var(--f-body)}
.intro .xpbar{height:18px;margin:8px 0}
.intro p{margin:0;font-size:13px;font-weight:600;color:var(--pencil);line-height:1.45}
.rsub{display:block;font-size:11px;font-weight:600;color:var(--pencil);line-height:1.3}

/* task lists */
.status{display:flex;align-items:center;gap:8px;font-size:14px;margin:0 0 10px;min-height:22px}
.sheet{background:var(--sheet);border-radius:24px;padding:4px 14px;box-shadow:0 6px 0 var(--shade)}
.trow{display:grid;grid-template-columns:50px minmax(0,1fr) 50px;gap:10px;align-items:center;padding:12px 0;border-bottom:2px solid var(--rule)}
.trow:last-child{border-bottom:0}
.t-time{font:800 14px/1.2 var(--f-num)}
.t-time small{display:block;color:var(--pencil);font-size:11px;font-weight:700}
.t-body{min-width:0;cursor:pointer}
.t-title{font-weight:800;font-size:16px;overflow-wrap:anywhere}
.t-meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--pencil);margin-top:1px;font-weight:600}
.cat{color:var(--cc);font-weight:800;display:inline-flex;align-items:center;gap:5px}
.cat::before{content:"";width:9px;height:9px;background:var(--cc);border-radius:50%}
.trow.now{background:var(--hl-soft);margin:0 -14px;padding-left:14px;padding-right:14px}
.trow.done .t-title{color:var(--pencil);text-decoration:line-through}
.stamp{width:48px;height:48px;border-radius:50%;border:3px dashed var(--go);background:var(--sheet);color:var(--good);font-size:12px;font-weight:800;padding:0}
.stamp:active{transform:scale(.92)}
.stamp:disabled{opacity:.35;cursor:not-allowed}
.seal{width:48px;height:48px;border-radius:50%;border:0;background:var(--go);color:var(--on);box-shadow:0 4px 0 var(--go-e);display:grid;place-items:center;font:900 13px var(--f-body);padding:0}
.seal.fresh{animation:stampIn .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes stampIn{from{transform:scale(2) rotate(-30deg);opacity:0}}
.empty{padding:26px 6px;text-align:center;color:var(--pencil);font-size:14px;font-weight:600}

/* week */
.weeknav{display:flex;align-items:center;gap:6px;margin-top:16px}
.weeknav h2{flex:1;min-width:0;margin:0 4px;font:900 17px/1.25 var(--f-body)}
.weeknav .ghost[data-wk]{min-width:44px}
.weeknav .ghost{padding:8px 12px;min-height:44px}
.daystrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:12px 0 14px}

.tcol div{position:absolute;right:6px;font:11px var(--f-num);color:var(--pencil);transform:translateY(-50%)}
.dcol{position:relative;border-right:1px solid var(--rule);cursor:copy}

.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:12px}

/* rewards */

/* stats */

dialog{border:0;padding:0;background:var(--sheet);color:var(--ink);width:100vw;max-width:560px;max-height:92vh;margin:auto auto 0;border-radius:26px 26px 0 0;overflow:auto;overscroll-behavior:contain}

/* welcome / login: full screen, shows on open until she signs in or chooses to skip */
#welcome{position:fixed;inset:0;z-index:54;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;display:flex;flex-direction:column;align-items:center;
  background:var(--sky2);background-image:linear-gradient(180deg,var(--sky1),var(--sky2) 75%);
  padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.wbox{width:min(400px,100%);margin:auto 0;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.wtitle{font:900 28px/1.2 var(--f-body);margin:0;color:var(--ink)}
.wwhy{margin:0;font-weight:700;font-size:15px;line-height:1.45;color:var(--ink);opacity:.85;max-width:330px}
.wdoll{position:relative;height:min(34vh,270px);display:flex;justify-content:center;align-items:flex-end;margin:4px 0 6px}
.wdoll::before{content:"";position:absolute;left:50%;bottom:-10px;width:min(72vw,270px);height:44px;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(closest-side,var(--floor2) 0 60%,var(--floor1) 61% 99%,transparent)}

.wbtns{width:100%;display:flex;flex-direction:column;gap:14px;margin-top:4px}

.wtop{width:100%;display:flex}
.wtop .ghost{min-height:44px}
.wcard{width:100%;background:var(--sheet);border-radius:24px;padding:16px 16px 6px;box-shadow:0 6px 0 var(--shade);text-align:left}

.wcard .field{margin-bottom:12px}
.wcard .field>label{display:block;font-weight:800;margin-bottom:4px}

/* celebration: he jumps in with the reward */
#celebrate{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;pointer-events:none;opacity:0;transition:opacity .2s;overflow-y:auto;
  background:rgba(20,26,50,.45);padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}

.celchar{height:min(34vh,280px);display:block;margin-bottom:-26px;position:relative;z-index:1;filter:drop-shadow(0 8px 10px rgba(0,0,0,.25))}

.ribbon{position:absolute;z-index:2;left:50%;top:-18px;transform:translateX(-50%);background:var(--red);color:var(--on);font:900 18px var(--f-body);padding:7px 22px;border-radius:14px;box-shadow:0 4px 0 var(--red-e);white-space:nowrap}

.steps li::before{content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;background:var(--sun);color:var(--on-sun);display:grid;place-items:center;font-weight:900;font-size:13px}

  display:flex;flex-direction:column;align-items:center;gap:8px;z-index:60;pointer-events:none}
.toast{background:var(--sheet);border-radius:18px;padding:9px 14px;display:flex;gap:10px;align-items:center;font-size:14px;font-weight:700;animation:rise .3s ease;max-width:380px;box-shadow:0 5px 0 var(--shade)}

#fx{position:fixed;inset:0;pointer-events:none;z-index:55}
.warn{background:var(--sheet);color:var(--danger);border-radius:16px;padding:8px 12px;margin-bottom:10px;font-size:13px;font-weight:700}

  padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}

.coachbox{position:relative;width:min(440px,100%);display:flex;gap:12px;align-items:flex-start;background:var(--sheet);padding:14px;border-radius:24px;box-shadow:0 6px 0 var(--shade),0 14px 30px rgba(0,0,0,.18)}

@media (max-height:700px){.room{--H:min(32vh,300px,calc((100vw - 152px) / .95))}@supports (height:1dvh){.room{--H:min(30dvh,300px,calc((100vw - 152px) / .95))}}.charwrap{padding-top:70px}.room{min-height:262px}.side{gap:8px}.home{gap:8px}

function seedTasks(){
  // The personal schedule is not shipped in the public code; it is imported on the phone from a backup.
  return [];
}

/* ---------- state ---------- */
let storageOK = true;
let state = load();
let ui = {tab:'home', weekOffset:0};
let freshStamp = null;

function freshState(){
  return {seedVer:SEED_VER,profile:{name:'',avatar:'',nicks:'',coach:'',herName:''},pet:{hunger:70,mood:80,last:Date.now(),voice:true},lang:/^zh/i.test(navigator.language || '') ? 'zh' : 'en',theme:'light',remind:{on:true,before:5},tasks:seedTasks(),done:{},badges:{}};
}
function mergeSeeds(s){
  for(const t of seedTasks()){
    const have = s.tasks.find(x => x.id === t.id);
    if(!have) s.tasks.push(t);
    else if(have.titleZh && !have.date) have.repeat = [...new Set([...(have.repeat||[]), ...t.repeat])];
  }
  s.seedVer = SEED_VER;
  return s;
}
// older versions saved a placeholder coach name ('Claude'); clear it so coachName() falls back to 安仁 / Anren
function migrate(st){
  st.profile = Object.assign({name:'',avatar:'',nicks:'',coach:'',herName:''}, st.profile);
  if(/^\s*claude\s*$/i.test(st.profile.coach || '')) st.profile.coach = '';
  return st;
}
function load(){
  try{
    const raw = localStorage.getItem(STORE);
    if(raw){
      const s = JSON.parse(raw);
      if(s && Array.isArray(s.tasks)){
        const st = migrate(Object.assign(freshState(), s));
        return (s.seedVer || 1) < SEED_VER ? mergeSeeds(st) : st;
      }
    }
  }catch(e){storageOK = false;}
  return freshState();
}
function save(){
  try{localStorage.setItem(STORE, JSON.stringify(state)); storageOK = true;}
  catch(e){storageOK = false;}
  cloudDirty();
}

const L = () => I18N[state.lang] || I18N.en;
const locale = () => state.lang === 'zh' ? 'zh-CN' : 'en-US';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey = k => {const [y,m,d] = k.split('-').map(Number); return new Date(y,m-1,d);};
const addDays = (d,n) => {const x = new Date(d); x.setDate(x.getDate()+n); return x;};
const mins = hhmm => {if(!hhmm) return null; const [h,m] = hhmm.split(':').map(Number); return h*60+m;};
const today = () => {const d = new Date(); d.setHours(0,0,0,0); return d;};
const mondayOf = d => {const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return x;};
const taskTitle = t => (state.lang === 'zh' && t.titleZh) ? t.titleZh : t.title;
const taskXP = t => DIFF_XP[t.diff] || 20;
const isDone = (t,k) => state.done[t.id+'|'+k] != null;
const timeLabel = t => t.end ? `${t.start}–${t.end}` : t.start;
const durMin = t => t.end ? Math.max(0, mins(t.end)-mins(t.start)) : 0;
const fmtDate = (d,opts) => d.toLocaleDateString(locale(), opts);
const nowMin = () => {const n = new Date(); return n.getHours()*60+n.getMinutes();};

function tasksFor(d){
  const k = keyOf(d), wd = d.getDay();
  return state.tasks
    .filter(t => t.date ? t.date === k : (t.repeat||[]).includes(wd))
    .sort((a,b) => mins(a.start)-mins(b.start));
}

function totalXP(){return Object.values(state.done).reduce((a,b) => a+(+b||0), 0);}
function levelInfo(xp){
  let lvl = 1, need = 100, rest = xp;
  while(rest >= need){rest -= need; lvl++; need = 100 + (lvl-1)*50;}
  return {lvl, cur:rest, need};
}
function levelTitle(lvl){
  let t = LEVEL_TITLES[0];
  for(const x of LEVEL_TITLES) if(lvl >= x.min) t = x;
  return t[state.lang] || t.en;
}

function doneDates(){
  const s = new Set();
  for(const k of Object.keys(state.done)) s.add(k.split('|')[1]);
  return s;
}
function streak(){
  const dates = doneDates();
  let d = today(), n = 0;
  if(!dates.has(keyOf(d))) d = addDays(d,-1);
  while(dates.has(keyOf(d))){n++; d = addDays(d,-1);}
  return n;
}
function clearedCount(){
  let n = 0;
  for(const k of doneDates()){
    const list = tasksFor(parseKey(k));
    if(list.length && list.every(t => isDone(t,k))) n++;
  }
  return n;
}
function gameStats(){
  const byId = Object.fromEntries(state.tasks.map(t => [t.id,t]));
  const cat = Object.fromEntries(CATS.map(c => [c,0]));
  let total = 0, early = false;
  for(const k of Object.keys(state.done)){
    total++;
    const t = byId[k.split('|')[0]];
    if(t){cat[t.cat] = (cat[t.cat]||0)+1; if(mins(t.start) < 9*60) early = true;}
  }
  return {total, cat, early, streak:streak(), clears:clearedCount(), level:levelInfo(totalXP()).lvl};
}
function checkBadges(){
  const s = gameStats(), fresh = [];
  for(const b of BADGES){
    if(!state.badges[b.id] && b.test(s)){state.badges[b.id] = keyOf(today()); fresh.push(b);}
  }
  if(fresh.length) save();
  return fresh;
}

/* ---------- completing ---------- */
function toggleDone(task, k){
  const id = task.id+'|'+k;
  if(state.done[id] != null){
    delete state.done[id]; save(); render(); toast('', L().undone); return;
  }
  if(parseKey(k) > today()) return;
  const before = levelInfo(totalXP()).lvl;
  const gain = taskXP(task);
  state.done[id] = gain;
  save();
  const after = levelInfo(totalXP()).lvl;
  const list = tasksFor(parseKey(k));
  const cleared = list.every(t => isDone(t,k));
  const fresh = checkBadges();
  freshStamp = id;
  render();
  freshStamp = null;

function weekNav(){
  const l = L(), ws = addDays(mondayOf(today()), ui.weekOffset*7), we = addDays(ws,6);
  const same = ws.getMonth() === we.getMonth();
  const range = state.lang === 'zh'
    ? `${ws.getMonth()+1}月${ws.getDate()}日–${same ? '' : (we.getMonth()+1)+'月'}${we.getDate()}日`
    : `${fmtDate(ws,{month:'short',day:'numeric'})}–${same ? we.getDate() : fmtDate(we,{month:'short',day:'numeric'})}`;
  return `<div class="weeknav"><h2>${esc(range)}</h2>
    <button class="ghost" data-wk="-1" aria-label="${esc(l.prevWeek)}">‹</button>
    <button class="ghost" data-wk="0" ${ui.weekOffset===0?'disabled':''}>${l.thisWeekBtn}</button>
    <button class="ghost" data-wk="1" aria-label="${esc(l.nextWeek)}">›</button></div>`;

function layoutDay(list){
  const items = list.map(t => {const s = mins(t.start); return {t, s, e: t.end ? Math.max(mins(t.end), s+25) : s+30};});
  items.sort((a,b) => a.s-b.s || b.e-a.e);
  const clusters = []; let cur = [], curEnd = -1;
  for(const it of items){
    if(cur.length && it.s >= curEnd){clusters.push(cur); cur = []; curEnd = -1;}
    cur.push(it); curEnd = Math.max(curEnd, it.e);
  }
  if(cur.length) clusters.push(cur);
  for(const cl of clusters){
    const lanes = [];
    for(const it of cl){
      let i = lanes.findIndex(end => end <= it.s);
      if(i < 0){i = lanes.length; lanes.push(0);}
      lanes[i] = it.e; it.lane = i;
    }
    cl.forEach(it => it.lanes = lanes.length);
  }
  return items;
}

function renderWeek(){
  const l = L(), ws = addDays(mondayOf(today()), ui.weekOffset*7), tk = keyOf(today());
  const days = [...Array(7)].map((_,i) => addDays(ws,i));
  if(isPhone()) return renderWeekPhone(days);
  const lists = days.map(d => layoutDay(tasksFor(d)));
  let minH = 7, maxH = 24;
  lists.flat().forEach(it => {minH = Math.min(minH, Math.floor(it.s/60)); maxH = Math.max(maxH, Math.ceil(it.e/60));});
  maxH = Math.min(maxH, 24);
  const H = (maxH-minH)*PX, nm = nowMin();
  let html = weekNav() + `<div class="gridwrap"><div class="wgrid"><div class="whead"></div>`;
  days.forEach(d => {
    const k = keyOf(d), list = tasksFor(d), dn = list.filter(t => isDone(t,k)).length;
    html += `<div class="whead ${k===tk?'today':''}">${l.daysShort[d.getDay()]}<b>${d.getMonth()+1}/${d.getDate()}</b>
      <span class="num">${list.length ? dn+'/'+list.length : '—'}</span></div>`;
  });
  html += `<div class="tcol" style="height:${H}px">`;
  for(let h=minH+1; h<maxH; h++) html += `<div style="top:${(h-minH)*PX}px">${pad(h)}:00</div>`;
  html += `</div>`;
  days.forEach((d,i) => {
    const k = keyOf(d);
    html += `<div class="dcol ${k===tk?'today':''}" data-day="${k}" data-min="${minH}" style="height:${H}px">`;
    for(let h=minH+1; h<maxH; h++) html += `<div class="hline" style="top:${(h-minH)*PX}px"></div>`;
    for(const it of lists[i]){
      const top = (it.s - minH*60)/60*PX, ht = (it.e-it.s)/60*PX - 2, w = 100/it.lanes;
      html += `<div class="blk ${isDone(it.t,k)?'done':''}" data-edit="${it.t.id}" data-k="${k}"
        style="--cc:var(--c-${it.t.cat});top:${top}px;height:${ht}px;left:calc(${w*it.lane}% + 2px);width:calc(${w}% - 4px)"
        title="${esc(timeLabel(it.t)+' '+taskTitle(it.t))}"><b>${esc(taskTitle(it.t))}</b>${ht>34?`<span class="num">${esc(timeLabel(it.t))}</span>`:''}</div>`;
    }
    if(k===tk && nm >= minH*60 && nm <= maxH*60) html += `<div class="nowline" style="top:${(nm-minH*60)/60*PX}px"></div>`;
    html += `</div>`;
  });
  html += `</div></div><div class="legend">${CATS.map(c => `<span class="cat" style="--cc:var(--c-${c})">${l.cats[c]}</span>`).join('')}</div>
    <div class="hint">${l.weekHint}</div>`;
  return html;
}

    </div>

    <div class="err" id="tErr"></div>
    <div class="actions">
      ${task ? `<button type="button" class="ghost danger" id="tDel">${l.del}</button>` : ''}
      <span class="spacer"></span>
      <button type="button" class="ghost" id="tCancel">${l.cancel}</button>
      <button type="submit" class="primary">${l.save}</button>
    </div>`;
  const f = document.getElementById('taskForm');
  const syncMode = () => {
    const w = f.mode.value === 'weekly';
    document.getElementById('fWeekly').hidden = !w;
    document.getElementById('fOnce').hidden = w;
  };
  f.querySelectorAll('[name=mode]').forEach(r => r.onchange = syncMode);
  syncMode();
  document.getElementById('tCancel').onclick = () => taskDlg.close();
  const del = document.getElementById('tDel');
  if(del) del.onclick = () => {
    if(del.dataset.armed){
      state.tasks = state.tasks.filter(x => x.id !== task.id);
      save(); taskDlg.close(); render();
    } else {del.dataset.armed = '1'; del.textContent = l.delConfirm;}
  };
  const cd = document.getElementById('ctxDone');
  if(cd) cd.onclick = () => {taskDlg.close(); toggleDone(task, ctx);};
  f.onsubmit = ev => {
    ev.preventDefault();
    const err = document.getElementById('tErr');
    const title = f.title.value.trim();
    const mode = f.mode.value;

    }
    save(); taskDlg.close(); render();
  };
  taskDlg.showModal();
}

/* saving files: an iPhone home-screen app ignores a.download, so offer copy / the share sheet first and keep a plain link last */
const IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function fileOf(name, text, type){try{return new File([text], name, {type});}catch(e){return null;}}
function canShareFile(f){try{return !!(f && navigator.share && navigator.canShare && navigator.canShare({files:[f]}));}catch(e){return false;}}
function shareFile(f, fail){navigator.share({files:[f], title:f.name}).catch(e => {if(!e || e.name !== 'AbortError') fail();});}
const fileUrls = {};
function fileLink(name, text, type){
  if(fileUrls[type]) URL.revokeObjectURL(fileUrls[type]);
  const u = fileUrls[type] = URL.createObjectURL(new Blob([text], {type}));
  return `<a href="${u}" download="${esc(name)}" target="_blank" rel="noopener">${esc(L().dlLink)}</a>`;
}
function exportData(){
  const l = L(), box = document.getElementById('expBox'), text = JSON.stringify(state);
  const name = `study-quest-backup-${keyOf(today())}.json`, f = fileOf(name, text, 'application/json');
  box.hidden = false;
  box.innerHTML = `<div class="hint" style="margin:0 0 6px">${esc(l.expHint)}</div>
    <textarea id="expTxt" rows="4" readonly aria-label="${esc(l.exportBtn)}">${esc(text)}</textarea>
    <div class="btnrow"><button class="c3d go" id="expCopy" style="flex:1">${esc(l.copy)}</button>${canShareFile(f) ? `<button class="ghost" id="expShare">${esc(l.shareFile)}</button>` : ''}</div>
    <div class="err" id="expErr"></div><div class="hint">${fileLink(name, text, 'application/json')}</div>`;
  const ta = document.getElementById('expTxt'), cb = document.getElementById('expCopy');
  const done = () => cb.textContent = l.copied, fail = () => document.getElementById('expErr').textContent = l.copyFail;
  // select the text (so a manual long-press copy also works) and copy it in the same tap; clipboard API as the backup
  const copy = () => {
    ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
    let ok = false; try{ok = document.execCommand('copy');}catch(e){}
    if(ok) done();
    else if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fail);
    else fail();
  };
  cb.onclick = copy;
  const sb = document.getElementById('expShare');
  if(sb) sb.onclick = () => shareFile(f, fail);
  box.scrollIntoView({block:'nearest'});
}
function importText(txt){
  try{
    const s = JSON.parse(String(txt).trim());
    if(!s || typeof s !== 'object' || !Array.isArray(s.tasks)) throw 0;
    // a schedule he sends has no photo / her names: keep what she already set on this phone
    const keep = state.profile, guided = state.guided, pet = state.pet;
    state = migrate(Object.assign(freshState(), s));
    if((+(s.pet && s.pet.last) || 0) < (+pet.last || 0)) state.pet = pet;
    for(const k of ['name','avatar','herName','nicks','coach']) if(!String(state.profile[k] || '').trim() && keep[k]) state.profile[k] = keep[k];
    if(guided) state.guided = guided;
    save(); profDlg.close(); render(); toast('', L().imported);
  }catch(e){
    const pe = profDlg.open && document.getElementById('pErr');
    if(pe) pe.textContent = L().badImport; else toast('', L().badImport);
  }
}
document.getElementById('importFile').onchange = e => {

};

  const pool = CHEERS[state.lang].concat((CAT_CHEERS[state.lang][task.cat]||[]), (CAT_CHEERS[state.lang][task.cat]||[]));
  let sealTxt = l.questDone, msg = pick(pool);
  if(cleared){sealTxt = l.stageClear; msg = l.allDone;}
  if(newLevel){sealTxt = l.levelUp; msg = `${l.youAreNow} ${l.level}${newLevel} ${levelTitle(newLevel)}`;}
  const R = REWARDS[state.lang], big = newLevel || cleared;
  const [re, rt] = pick(big ? R.big : R.small);
  const pose = big ? 'happy' : re === '😘' ? 'kiss' : re === '🤗' || re === '🫶' ? 'love' : pick(['happy','kiss','love']);
  const el = document.getElementById('celebrate');
  el.innerHTML = `<img class="celchar" src="${charSrc(pose)}" alt=""><div class="celcard"><div class="ribbon">${esc(sealTxt)}</div><div class="xp">+${gain} ${l.xp}</div><p>${esc(msg)}</p>
    <div class="reward"><span class="re">${re}</span><div><div class="who2">${esc(coachName())}</div>${esc(fill(rt,{n:nick()}))}</div></div></div>`;
  el.classList.remove('show','guide'); void el.offsetWidth; el.classList.add('show');
  el.onclick = () => el.classList.remove('show');
  clearTimeout(celTimer);
  celTimer = setTimeout(() => el.classList.remove('show'), big ? 6000 : 4200);
  thump();
  confetti(big ? 140 : 50);
  herReact('happy', 'hop', 4500);
}
function toast(sealTxt, html){
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `${sealTxt ? `<span class="mini">${esc(sealTxt)}</span>` : ''}<span>${html}</span>`;
  document.getElementById('toasts').appendChild(t);
  setTimeout(() => t.remove(), 3800);
}
function thump(){
  try{
    const a = new (window.AudioContext || window.webkitAudioContext)(), t = a.currentTime;
    [523,659,784].forEach((f,i) => {
      const o = a.createOscillator(), g = a.createGain();
      o.type = 'triangle'; o.frequency.value = f; o.connect(g); g.connect(a.destination);
      g.gain.setValueAtTime(.0001, t+i*.09); g.gain.exponentialRampToValueAtTime(.16, t+i*.09+.02); g.gain.exponentialRampToValueAtTime(.001, t+i*.09+.3);
      o.start(t+i*.09); o.stop(t+i*.09+.32);
    });
  }catch(e){}
}
const fx = document.getElementById('fx'), ctx2 = fx.getContext('2d');
let parts = [], raf = 0;
function confetti(n){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  fx.width = innerWidth; fx.height = innerHeight;
  const cs = getComputedStyle(document.documentElement);
  const colors = ['--sun','--pink','--go','--blue','--red'].map(v => cs.getPropertyValue(v).trim());
  for(let i=0;i<n;i++) parts.push({x:innerWidth/2, y:innerHeight*.35, vx:(Math.random()-.5)*14, vy:Math.random()*-12-3,
    s:Math.random()*6+5, r:Math.random()*6, vr:(Math.random()-.5)*.3, c:pick(colors), life:120+Math.random()*60});
  if(!raf) raf = requestAnimationFrame(tick);
}
function tick(){
  ctx2.clearRect(0,0,fx.width,fx.height);
  parts = parts.filter(p => p.life-- > 0 && p.y < fx.height+20);
  for(const p of parts){
    p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
    ctx2.save(); ctx2.translate(p.x,p.y); ctx2.rotate(p.r); ctx2.fillStyle = p.c;
    ctx2.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx2.restore();
  }
  raf = parts.length ? requestAnimationFrame(tick) : (ctx2.clearRect(0,0,fx.width,fx.height), 0);
}

function coachAvatar(pose='remind'){return `<div class="cav"><img src="${charSrc(pose)}" alt=""></div>`;}
const fill = (s,o) => s.replace(/\{(\w)\}/g, (_,k) => o[k] ?? '');

const coachDefault = () => state.lang === 'zh' ? COACH_DEFAULT : 'Anren';
const coachName = () => {const n = String(state.profile.coach || '').trim(); return n && !/^claude$/i.test(n) ? n : coachDefault();};
function nick(){
  const list = String(state.profile.nicks || '').split(/[,，、]/).map(s => s.trim()).filter(Boolean);
  return list.length ? pick(list) : (state.profile.name || L().defaultName);
}
function coachGreeting(list, k, nm){
  const c = COACH[state.lang], n = nick();
  const h = Math.floor(nm/60);
  const hi = fill(h < 5 ? c.night : h < 12 ? c.morning : h < 18 ? c.afternoon : h < 23 ? c.evening : c.night, {n});
  if(!list.length) return hi + ' ' + c.free;
  const dn = list.filter(t => isDone(t,k)).length;
  if(dn === list.length) return hi + ' ' + c.cleared;
  const nx = list.find(t => !isDone(t,k) && mins(t.start) >= nm) || list.find(t => !isDone(t,k));
  if(!dn) return hi + ' ' + fill(c.plan, {c:list.length, t:taskTitle(nx), s:nx.start});
  return hi + ' ' + fill(c.left, {d:dn, r:list.length-dn, t:taskTitle(nx), s:nx.start});
}

function beep(){
  try{
    const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain();
    o.connect(g); g.connect(a.destination); o.frequency.value = 880;
    g.gain.setValueAtTime(.12, a.currentTime); g.gain.exponentialRampToValueAtTime(.001, a.currentTime+.5);
    o.start(); o.stop(a.currentTime+.5);
  }catch(e){}
}
const fired = new Set();
function checkReminders(){
  if(!state.remind || !state.remind.on) return;
  const c = COACH[state.lang], d = today(), k = keyOf(d), nm = nowMin();
  const before = +state.remind.before || 0;
  for(const t of tasksFor(d)){
    if(isDone(t,k)) continue;
    const s = mins(t.start), o = {t:taskTitle(t), s:t.start, m:before, x:taskXP(t), n:nick()};
    const fire = (type, cond, msg, withDone) => {
      const id = type+'|'+t.id+'|'+k;
      if(cond && !fired.has(id)){fired.add(id); coachSay(fill(msg,o), withDone ? t : null, k);}
    };
    fire('soon', before > 0 && nm >= s-before && nm < s, c.soon, false);
    fire('start', nm >= s && nm < s+3, c.start, false);
    if(t.end) fire('end', nm >= mins(t.end) && nm < mins(t.end)+15, c.end, true);
  }
}

let petHits = [], angryUntil = 0, chubbyUntil = 0, petTimer;
function petNow(){
  const p = state.pet, hrs = (Date.now() - (p.last || Date.now()))/36e5;
  return {hunger:Math.max(0, Math.round(p.hunger - hrs*6)), mood:Math.max(0, Math.round(p.mood - hrs*3))};
}
function petAdjust(dh, dm){
  const cur = petNow();
  state.pet.hunger = Math.max(0, Math.min(100, cur.hunger + dh));
  state.pet.mood = Math.max(0, Math.min(100, cur.mood + dm));
  state.pet.last = Date.now();
  save();
}
const isNight = () => {const h = new Date().getHours(); return h >= 23 || h < 6;};
function petIdleExpr(){
  const p = petNow();
  if(Date.now() < angryUntil) return 'angry';
  if(Date.now() < chubbyUntil) return 'chubby';
  if(p.hunger < 30) return 'hungry';
  if(p.mood < 30) return 'sad';
  if(isNight()) return 'sleepy';
  return 'normal';
}
function meterColor(id, v){return v < 30 ? 'var(--red)' : id === 'mH' ? 'var(--sun)' : 'var(--pink)';}
function petFx(emoji, n=1){
  const box = document.getElementById('petfx');
  if(!box) return;
  for(let i=0;i<n;i++){
    const s = document.createElement('span');
    s.className = 'fxe'; s.textContent = emoji;
    s.style.left = (25 + Math.random()*50) + '%';
    s.style.top = (25 + Math.random()*30) + '%';
    s.style.animationDelay = (i*0.12) + 's';
    box.appendChild(s);
    setTimeout(() => s.remove(), 1600 + i*120);
  }
}
function petSayText(text){
  const el = document.getElementById('petSay');
  if(!el) return;
  el.textContent = text;
  el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
}
function petSay(text){
  petSayText(text);
  if(!state.pet.voice || !('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu,''));
    u.lang = state.lang === 'zh' ? 'zh-CN' : 'en-US'; u.pitch = 1.6; u.rate = 1.05;
    speechSynthesis.speak(u);
  }catch(e){}
}
function sfx(kind){
  try{
    const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain();
    o.connect(g); g.connect(a.destination);
    const t = a.currentTime;
    if(kind === 'hit'){o.type = 'square'; o.frequency.setValueAtTime(420,t); o.frequency.exponentialRampToValueAtTime(90,t+.25);}
    else if(kind === 'eat'){o.type = 'triangle'; o.frequency.setValueAtTime(300,t); o.frequency.setValueAtTime(450,t+.08); o.frequency.setValueAtTime(320,t+.16);}
    else {o.type = 'sine'; o.frequency.setValueAtTime(600,t); o.frequency.exponentialRampToValueAtTime(1100,t+.2);}
    g.gain.setValueAtTime(.12,t); g.gain.exponentialRampToValueAtTime(.001,t+.3);
    o.start(); o.stop(t+.3);
  }catch(e){}
}
function petAction(kind, food){
  const P = PET[state.lang], n = nick(), el = document.getElementById('pet');
  if(!el) return;
  const tray = document.getElementById('foods');
  if(kind === 'feed' && !food){tray.hidden = !tray.hidden; return;}
  if(tray) tray.hidden = true;
  // after a few taps she knows how the room works, so the hints go away
  state.pet.taps = (state.pet.taps || 0) + 1; save();
  if(state.pet.taps >= 4) document.querySelectorAll('#tapMe,#roomHint').forEach(x => x.remove());
  let expr = 'happy', anim = 'love', line;
  const angry = Date.now() < angryUntil;
  if(kind === 'feed'){
    if(petNow().hunger >= 100){line = pick(P.full); expr = 'chubby'; anim = 'hop'; chubbyUntil = Date.now() + 20000;}
    else {petAdjust(15, 4); line = pick(P.feed); expr = 'eat'; anim = 'eat'; petFx(food, 1); setTimeout(() => petFx('😋'), 700);}
    sfx('eat');
  } else if(kind === 'hit'){
    const now = Date.now();
    petHits = petHits.filter(t => now - t < 20000); petHits.push(now);
    petAdjust(0, -8);
    if(petHits.length >= 5 || angry){angryUntil = now + 15000; line = pick(P.angry); expr = 'angry'; anim = 'angry'; petFx('💢');}
    else {line = pick(P.hit); expr = 'hurt'; anim = 'hit'; petFx(pick(['💥','💫','⭐']), 2);}
    sfx('hit');
  } else if(kind === 'hug'){
    petAdjust(0, 12);
    if(angry){angryUntil = 0; petHits = []; line = pick(P.makeup);} else line = pick(P.hug);
    expr = 'love'; petFx('💕', 3); sfx('love');
  } else if(kind === 'kiss'){
    petAdjust(0, 10);
    if(angry){angryUntil = 0; petHits = []; line = pick(P.makeup); expr = 'love';} else {line = pick(P.kiss); expr = 'kiss';}
    petFx('💋', 2); setTimeout(() => petFx('💗', 2), 300); sfx('love');
  } else if(kind === 'pat'){
    petAdjust(0, 6);
    if(angry){line = pick(P.angry); expr = 'angry'; anim = 'angry';}
    else {line = pick(P.pat); expr = pick(['happy','love']); petFx('✨', 2);}
    sfx('love');
  } else {
    if(angry){line = pick(P.angry); expr = 'angry'; anim = 'angry';}
    else if(isNight()){line = pick(P.sleepy); expr = 'sleepy'; anim = 'hop';}
    else {line = pick(P.poke); expr = pick(['happy','left','right','kiss','love','remind']); anim = 'hop';}
  }
  const hr = {feed: expr === 'chubby' ? 'chubby' : 'eat', hit:'pout', hug:'blush', kiss:'blush'}[kind];
  if(hr) herReact(hr, kind === 'hit' ? 'angry' : 'love');
  el.className = 'pet'; void el.offsetWidth; el.className = 'pet ' + anim;
  el.querySelector('img').src = charSrc(expr);
  petSay(fill(line, {n}));
  const p = petNow();
  for(const [id,v] of [['mH',p.hunger],['mM',p.mood]]){
    const bar = document.getElementById(id);
    if(bar){bar.style.width = v + '%'; bar.parentElement.style.setProperty('--cc', meterColor(id, v));}
  }
  clearTimeout(petTimer);
  petTimer = setTimeout(() => {
    const pe = document.getElementById('pet');
    if(pe){pe.className = 'pet idle'; pe.querySelector('img').src = charSrc(petIdleExpr());}
  }, 2800);
}

/* calendar file (.ics) so the phone's own calendar pops up his reminders */
function icsText(s){return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');}
function icsFold(line){
  const out = []; let cur = '', bytes = 0;
  for(const ch of line){
    const b = new TextEncoder().encode(ch).length;
    if(bytes + b > 73){out.push(cur); cur = ' '; bytes = 1;}
    cur += ch; bytes += b;
  }
  out.push(cur);
  return out.join('\r\n');
}
function exportCalendar(){
  const c = COACH[state.lang], before = +state.remind.before || 0;
  const BY = ['SU','MO','TU','WE','TH','FR','SA'];
  const stamp = new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const dt = (d, hhmm) => keyOf(d).replace(/-/g,'') + 'T' + hhmm.replace(':','') + '00';
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Study Quest//Coach//EN','CALSCALE:GREGORIAN','X-WR-CALNAME:Study Quest'];
  for(const t of state.tasks){
    let first;
    if(t.date) first = parseKey(t.date);
    else {
      if(!(t.repeat||[]).length) continue;
      first = today();
      while(!t.repeat.includes(first.getDay())) first = addDays(first,1);
    }
    const n = nick(), o = {t:taskTitle(t), s:t.start, x:taskXP(t), n};
    const endM = t.end ? mins(t.end) : Math.min(mins(t.start)+15, 23*60+59);
    lines.push('BEGIN:VEVENT', `UID:${t.id}@study-quest`, `DTSTAMP:${stamp}`,
      `DTSTART:${dt(first,t.start)}`, `DTEND:${dt(first,`${pad(Math.floor(endM/60))}:${pad(endM%60)}`)}`);
    if(!t.date) lines.push(`RRULE:FREQ=WEEKLY;BYDAY=${t.repeat.map(d => BY[d]).join(',')}`);
    lines.push(`SUMMARY:${icsText(`${CAT_EMOJI[t.cat]} ${taskTitle(t)} · ${fill(pick(c.cal),{n})}`)}`,
      `DESCRIPTION:${icsText(fill(c.calDesc,{...o,c:coachName()}))}`,
      'BEGIN:VALARM','ACTION:DISPLAY',`TRIGGER:-PT${before}M`,`DESCRIPTION:${icsText(fill(c.soon,{...o,m:before}))}`,'END:VALARM',
      'END:VEVENT');
  }
  lines.push('END:VCALENDAR');
  const box = document.getElementById('calBox');
  if(lines.length < 7){if(box){box.hidden = false; box.innerHTML = `<div class="err">${esc(c.calNone)}</div>`;} return;}
  const text = lines.map(icsFold).join('\r\n')+'\r\n', name = 'study-quest-reminders.ics', type = 'text/calendar';
  const f = fileOf(name, text, type);
  // iPhone: the share sheet (Calendar / Save to Files); else open the file so iOS offers "Add All"; else a normal download
  const open = () => {
    if(IOS && window.open('data:text/calendar;charset=utf-8,' + encodeURIComponent(text), '_blank')) return;
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  };
  if(canShareFile(f)) shareFile(f, open); else open();
  if(box){
    box.hidden = false;
    box.innerHTML = `<div class="hint" style="margin:0 0 6px">${esc(c.calHint)}</div>${canShareFile(f) ? `<div class="btnrow"><button class="ghost" id="calShare">${esc(L().shareFile)}</button></div>` : ''}
      <div class="hint">${fileLink(name, text, type)}</div>`;
    const sb = document.getElementById('calShare');
    if(sb) sb.onclick = () => shareFile(f, open);
  }
}

class SbErr extends Error{constructor(status, code, msg){super(msg || code || 'error'); this.status = status; this.code = code || '';}}
async function sbRaw(path, {method='GET', body, headers={}, token, keepalive}={}){
  const h = Object.assign({apikey:SB_KEY, 'Content-Type':'application/json'}, headers);
  if(token) h.Authorization = 'Bearer ' + token;
  const ctl = window.AbortController ? new AbortController() : null, tm = ctl && setTimeout(() => ctl.abort(), 15000);
  const b = body === undefined ? undefined : JSON.stringify(body);

  try{r = await fetch(SB_URL + path, {method, headers:h, body:b, signal:ctl ? ctl.signal : undefined, keepalive:!!keepalive && (b || '').length < 60000, cache:'no-store'});}
  catch(e){throw new SbErr(0, 'net', 'network');}
  finally{clearTimeout(tm);}
  const txt = await r.text().catch(() => '');
  let j = null; try{j = txt ? JSON.parse(txt) : null;}catch(e){}
  if(!r.ok) throw new SbErr(r.status, j && (j.error_code || j.code || j.error), j && (j.msg || j.message || j.error_description || j.error) || txt);
  return j;
}
function keepSess(j, old){
  const s = {access_token:j.access_token, refresh_token:j.refresh_token,
    expires_at:+j.expires_at || Math.floor(Date.now()/1000) + (+j.expires_in || 3600),
    user:{id:(j.user && j.user.id) || old.user.id, username:(old && old.user && old.user.username) || ''}};
  lsSet('sq.session', JSON.stringify(s));
  return s;
}
let refreshing = null;
async function accToken(force){
  const s = accSess();
  if(!s) throw new SbErr(401, 'nosess', 'signed out');
  if(!force && sessExp(s) - Date.now() > 60000) return s.access_token;
  if(!refreshing) refreshing = sbRaw('/auth/v1/token?grant_type=refresh_token', {method:'POST', body:{refresh_token:s.refresh_token}})
    .then(j => keepSess(j, s))
    .catch(e => {
      const now = accSess();
      if(now && now.refresh_token !== s.refresh_token) return now;   // another tab refreshed it already
      if(e.status === 400 || e.status === 401) dropSess();            // refresh token is dead: signed out on this phone
      throw e;
    })
    .finally(() => {refreshing = null;});
  return (await refreshing).access_token;
}
// signed-in request; one retry with a fresh token if the server says the token expired
async function sbAuth(path, opt={}){

  catch(e){if(e.status !== 401 || e.code === 'nosess') throw e; return sbRaw(path, Object.assign({}, opt, {token:await accToken(true)}));}
}

function cloudSync(opt={}){

const codeLeft = () => acct.code ? Math.ceil((acct.codeAt + 30*60000 - Date.now())/60000) : 0;
function watchPair(){
  clearTimeout(pairTimer);
  if((!profDlg.open && !pairUp) || !accSess() || acct.partner || codeLeft() <= 0) return;
  pairTimer = setTimeout(() => loadProfiles().then(() => {
    renderAcc(); if(pairUp) showPairOffer();
    if(acct.partner) cloudSync(); else watchPair();
  }, () => watchPair()), 5000);
}
profDlg.addEventListener('close', () => clearTimeout(pairTimer));

/* the account section in settings */
function accHTML(){
  const a = accT(), s = accSess(), c = coachName();
  if(!s){
    const up = acct.mode === 'up';
    return `<h4>${esc(a.title)}</h4><div class="hint">${esc(fill(a.why, {c}))}</div>
      <form id="accForm" novalidate>
        <div class="seg" style="margin-bottom:12px"><label><input type="radio" name="am" value="in" ${up ? '' : 'checked'}><span>${esc(a.signIn)}</span></label>
          <label><input type="radio" name="am" value="up" ${up ? 'checked' : ''}><span>${esc(a.signUp)}</span></label></div>
        <div class="field"><label for="aUser">${esc(a.user)}</label><input id="aUser" name="username" maxlength="20" value="${esc(acct.u)}" placeholder="${esc(a.userPh)}"
          autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"><div class="hint">${esc(a.userHint)}</div></div>
        <div class="field"><label for="aPw">${esc(a.pw)}</label><div class="pwrow"><input id="aPw" name="password" type="${acct.eye ? 'text' : 'password'}" value="${esc(acct.p)}"
          autocomplete="${up ? 'new-password' : 'current-password'}" autocapitalize="none" autocorrect="off" spellcheck="false">
          <button type="button" class="ghost" id="aEye" aria-pressed="${acct.eye}">${esc(acct.eye ? a.hide : a.show)}</button></div>
          ${up ? `<div class="hint">${esc(a.pwHint)}</div>` : ''}</div>
        <div class="err" id="aErr" role="alert"></div>
        <div class="btnrow" style="margin-bottom:12px"><button type="submit" class="c3d go" id="aGo" style="flex:1;font-size:17px">${esc(up ? a.signUpGo : a.signInGo)}</button></div>
      </form>`;
  }
  const name = (acct.me && acct.me.username) || s.user.username || '';
  let pair;
  if(isHis()) pair = `<div class="hint" style="margin-bottom:12px">${esc(a.hisAcc)}</div>`;
  else if(acct.partner) pair = `<div class="paired">${coachAvatar('love')}<span>${esc(fill(a.paired, {p:partnerName()}))}</span></div>
      <div class="btnrow" style="margin-bottom:12px"><button class="ghost danger" id="aUnpair">${esc(acct.unlink ? a.unlinkSure : a.unlink)}</button></div>`;
  else if(!acct.me) pair = `<div class="hint" style="margin-bottom:12px">${esc(a.needNet)}</div>`;
  else if(codeLeft() > 0) pair = `<div class="paircode num" aria-live="polite">${esc(acct.code)}</div>
      <div class="hint" style="margin:0 0 6px">${esc(fill(a.codeHint, {c, m:codeLeft()}))}</div>
      <div class="btnrow" style="margin-bottom:12px"><button class="ghost" id="aCode">${esc(a.newCode)}</button></div>`;
  else pair = `<div class="hint" style="margin:0 0 6px">${esc(fill(a.pairWhy, {c}))}</div>
      <div class="btnrow" style="margin-bottom:12px"><button class="c3d pink" id="aCode" style="flex:1">💞 ${esc(fill(a.connect, {c}))}</button></div>`;
  return `<h4>${esc(a.title)}</h4>
    <div class="accme"><div><div class="accname">${esc(name)}</div><div class="accst" id="accSt">${stHTML()}</div></div>
      <button class="ghost" id="aSync">${esc(a.syncNow)}</button></div>
    ${isHis() ? '' : `<h5>${esc(a.connectT)}</h5>`}${pair}
    <div class="btnrow" style="margin-bottom:12px"><button class="ghost" id="aOut">${esc(a.signOut)}</button></div>`;
}
function renderAcc(){
  const g = document.getElementById('accGrp');
  if(!g) return;
  const a = accT(), f0 = document.activeElement && document.activeElement.id;
  g.innerHTML = accHTML();
  const $ = id => document.getElementById(id);
  const form = $('accForm');
  if(form){
    const keep = () => {acct.u = $('aUser').value; acct.p = $('aPw').value;};
    form.querySelectorAll('[name=am]').forEach(r => r.onchange = () => {keep(); acct.mode = r.value; renderAcc(); $('aUser').focus();});
    $('aUser').oninput = $('aPw').oninput = keep;
    $('aEye').onclick = () => {keep(); acct.eye = !acct.eye; renderAcc(); $('aPw').focus();};
    form.onsubmit = accSubmit;
    if(f0 && $(f0)) $(f0).focus();
    return;
  }
  $('aSync').onclick = () => {setSt('sync'); cloudTick();};
  $('aOut').onclick = accSignOut;
  const cb = $('aCode');
  if(cb) cb.onclick = async () => {
    cb.disabled = true;
    try{
      await newPairCode();
      renderAcc(); watchPair();
    }catch(e){cb.disabled = false; toast('', esc(accErr(e)));}
  };
  const ub = $('aUnpair');
  if(ub) ub.onclick = async () => {
    if(!acct.unlink){acct.unlink = true; ub.textContent = a.unlinkSure; return;}
    ub.disabled = true;
    try{await sbAuth('/rest/v1/rpc/unpair', {method:'POST', body:{}}); acct.unlink = false; await loadProfiles();}
    catch(e){toast('', esc(accErr(e)));}
    renderAcc();
  };
  if(acct.code && !acct.partner) watchPair();
}
function accErr(e){
  const a = accT(), m = String((e && e.code) || '') + ' ' + String((e && e.message) || '');
  if(!e || !e.status) return a.errNet;
  if(/already.registered|user_already_exists|email_exists/i.test(m)) return a.errTaken;
  if(/invalid_credentials|invalid login/i.test(m)) return a.errWrong;
  if(/email_not_confirmed|not confirmed/i.test(m)) return a.created;
  if(/email_send_rate|email_provider|signup_disabled/i.test(m)) return a.errSetup;
  if(e.status === 429) return a.errMany;
  if(/weak_password/i.test(m)) return a.errPw;
  return a.errOther;
}
// sign up / sign in, then the first-sign-in sync. Shared by the settings form and the welcome screen.
// Resolves to '' when signed in, otherwise the text to show her.
async function accAuth(up, u, p){
  const a = accT();
  if(!/^[a-z0-9]{3,20}$/.test(u)) return a.errUser;
  if(p.length < 6) return a.errPw;
  const email = u + '@study-quest.app';
  let j;
  try{
    j = up
      ? await sbRaw('/auth/v1/signup', {method:'POST', body:{email, password:p, data:{username:u, display_name:String(state.profile.name || '').trim() || u, role:'her'}}})
      : await sbRaw('/auth/v1/token?grant_type=password', {method:'POST', body:{email, password:p}});
  }catch(e){return accErr(e);}
  if(!j || !j.access_token){acct.mode = 'in'; return a.created;}   // sign-up worked but email confirmation is still on
  ['sq.lastPush','sq.dirty','sq.syncAt'].forEach(k => lsSet(k, null));
  keepSess(j, {user:{id:j.user.id, username:u}});
  lsSet('sq.skipLogin', null);
  const mode = acct.mode; acct = freshAcct(); acct.mode = mode;
  renderAcc(); render();
  await cloudSync({prof:true});
  return '';
}
async function accSubmit(ev){
  ev.preventDefault();
  const a = accT(), go = document.getElementById('aGo');
  acct.u = document.getElementById('aUser').value.trim().toLowerCase(); acct.p = document.getElementById('aPw').value;
  document.getElementById('aErr').textContent = ''; go.disabled = true; go.textContent = a.wait;
  const msg = await accAuth(acct.mode === 'up', acct.u, acct.p);
  if(!msg){if(acct.st === 'ok') toast('', esc(a.welcome)); pollMsgs(); return;}
  renderAcc();
  const er = document.getElementById('aErr'); if(er) er.textContent = msg;
}
async function accSignOut(){
  const s = accSess(); if(!s) return;
  const ob = document.getElementById('aOut'); if(ob) ob.disabled = true;
  // last push first, but never wait long
  if(lsGet('sq.dirty')) await Promise.race([cloudSync(), new Promise(r => setTimeout(r, 4000))]);
  sbRaw('/auth/v1/logout', {method:'POST', token:s.access_token}).catch(() => {});
  lsSet('sq.skipLogin', '1');   // she chose to sign out: don't greet her with the login screen next time
  dropSess(); toast('', esc(accT().outDone));
}

/* welcome / login screen: on open while signed out, until she signs in or taps "use without an account" */
const welEl = document.getElementById('welcome');
const wel = {step:'intro', u:'', p:'', eye:false, busy:false};
const needWelcome = () => !accSess() && !lsGet('sq.skipLogin');
function showWelcome(step='intro'){
  wel.step = step; wel.busy = false;
  if(profDlg.open) profDlg.close();
  document.getElementById('celebrate').classList.remove('show');
  renderWelcome(); welEl.hidden = false; welEl.scrollTop = 0;
}
function closeWelcome(){welEl.hidden = true; welEl.innerHTML = '';}
function renderWelcome(){
  const a = accT(), c = coachName(), s = wel.step, $ = id => document.getElementById(id);
  const doll = e => `<div class="wdoll"><img src="${herSrc(e)}" alt="${esc(herName())}"></div>`;
  let h;
  if(s === 'intro') h = `${doll('happy')}<h1 class="wtitle">${esc(a.wTitle)}</h1><p class="wwhy">${esc(fill(a.wWhy, {c}))}</p>
    <div class="wbtns"><button class="c3d go" id="wUp">${esc(a.wUp)}</button><button class="c3d blue" id="wIn">${esc(a.wIn)}</button></div>
    <button class="wskip" id="wSkip">${esc(a.wSkip)}</button>`;
  else if(s === 'him') h = `${doll('pout')}<div class="wcard"><p>${esc(a.hisAcc)}</p>
    <div class="wbtns" style="margin-bottom:12px"><a class="c3d blue" href="partner.html">${esc(a.openPartner)}</a><button class="ghost" id="wOut">${esc(a.signOut)}</button></div></div>`;
  else {
    const up = s === 'up';
    h = `<div class="wtop"><button class="ghost" id="wBack">‹ ${esc(a.back)}</button></div>${doll(up ? 'happy' : 'blush')}<h1 class="wtitle">${esc(up ? a.wUpT : a.wInT)}</h1>
    <form class="wcard" id="wForm" novalidate>
      <div class="field"><label for="wUser">${esc(a.user)}</label><input id="wUser" name="username" maxlength="20" value="${esc(wel.u)}" placeholder="${esc(a.userPh)}"
        autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next"><div class="hint">${esc(a.userHint)}</div></div>
      <div class="field"><label for="wPw">${esc(a.pw)}</label><div class="pwrow"><input id="wPw" name="password" type="${wel.eye ? 'text' : 'password'}" value="${esc(wel.p)}"
        autocomplete="${up ? 'new-password' : 'current-password'}" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go">
        <button type="button" class="ghost" id="wEye" aria-pressed="${wel.eye}">${esc(wel.eye ? a.hide : a.show)}</button></div>
        ${up ? `<div class="hint">${esc(a.pwHint)}</div>` : ''}</div>
      <div class="err" id="wErr" role="alert"></div>
      <button type="submit" class="c3d go" id="wGo" style="width:100%;min-height:54px;font-size:18px;margin-top:6px">${esc(up ? a.signUpGo : a.signInGo)}</button>
      <button type="button" class="linkbtn" id="wSwap" style="width:100%;min-height:44px;margin-top:6px">${esc(up ? a.wToIn : a.wToUp)}</button>
    </form>`;
  }
  welEl.innerHTML = `<div class="wbox ${s === 'up' || s === 'in' ? 'wform' : ''}">${h}</div>`;
  const on = (id, f) => {const b = $(id); if(b) b.onclick = f;};
  on('wUp', () => showWelcome('up'));
  on('wIn', () => showWelcome('in'));
  on('wSkip', () => {lsSet('sq.skipLogin', '1'); closeWelcome(); toast('', esc(a.wSkipped)); afterWelcome();});
  on('wBack', () => {keepW(); showWelcome('intro');});
  on('wSwap', () => {keepW(); showWelcome(s === 'up' ? 'in' : 'up');});
  on('wOut', async () => {await accSignOut(); lsSet('sq.skipLogin', null); showWelcome('intro');});
  on('wEye', () => {
    wel.eye = !wel.eye; const pw = $('wPw'), b = $('wEye');
    pw.type = wel.eye ? 'text' : 'password'; b.textContent = wel.eye ? a.hide : a.show; b.setAttribute('aria-pressed', wel.eye); pw.focus();
  });
  const form = $('wForm');
  if(form) form.onsubmit = async ev => {
    ev.preventDefault();
    if(wel.busy) return;
    keepW(); wel.u = wel.u.trim().toLowerCase();
    const go = $('wGo'), up = s === 'up';
    wel.busy = true; go.disabled = true; go.textContent = a.wait; $('wErr').textContent = '';
    const msg = await accAuth(up, wel.u, wel.p);
    wel.busy = false;
    if(msg){
      if(up && acct.mode === 'in' && msg === a.created){showWelcome('in'); $('wErr').textContent = msg; return;}
      go.disabled = false; go.textContent = up ? a.signUpGo : a.signInGo; $('wErr').textContent = msg; return;
    }
    wel.p = ''; wel.eye = false;
    if(isHis()){showWelcome('him'); return;}
    closeWelcome();
    if(acct.st === 'ok') toast('', esc(a.welcome));
    pollMsgs();
    afterWelcome();
  };
  function keepW(){const u = $('wUser'), p = $('wPw'); if(u) wel.u = u.value; if(p) wel.p = p.value;}
}
// after the welcome screen: offer to connect with him (optional), then the first-time guide
function afterWelcome(){
  if(accSess() && acct.me && !isHis() && !acct.partner) setTimeout(showPairOffer, 300);
  else if(!state.guided) setTimeout(showGuide, 400);
}
function showPairOffer(){
  const a = accT(), c = coachName(), el = document.getElementById('celebrate');
  pairUp = true;
  let body;
  if(acct.partner) body = `<p>${esc(fill(a.joined, {p:partnerName()}))}</p>`;
  else if(codeLeft() > 0) body = `<div class="paircode num" aria-live="polite">${esc(acct.code)}</div><div class="hint" style="margin:0 0 6px">${esc(fill(a.codeHint, {c, m:codeLeft()}))}</div>`;
  else body = `<p>${esc(fill(a.pairWhy, {c}))}</p><button class="c3d pink" id="wCode" style="width:100%;margin-top:12px;font-size:17px;min-height:50px">💞 ${esc(fill(a.connect, {c}))}</button>`;
  el.innerHTML = `<img class="celchar" src="${charSrc(acct.partner ? 'love' : 'happy')}" alt=""><div class="celcard"><div class="ribbon">${esc(fill(a.connect, {c}))}</div>${body}
    <button class="${acct.partner ? 'c3d go' : 'ghost'}" id="wLater" style="width:100%;margin-top:12px;min-height:48px;font-size:16px">${esc(acct.partner ? a.gotIt : a.later)}</button></div>`;
  el.classList.add('show','guide'); el.onclick = null; clearTimeout(celTimer); el.scrollTop = 0;
  const cb = document.getElementById('wCode');
  if(cb) cb.onclick = async () => {
    cb.disabled = true; cb.textContent = a.wait;
    try{await newPairCode(); showPairOffer();}
    catch(e){cb.disabled = false; cb.textContent = '💞 ' + fill(a.connect, {c}); toast('', esc(accErr(e)));}
  };
  document.getElementById('wLater').onclick = () => {
    el.classList.remove('show','guide'); pairUp = false; clearTimeout(pairTimer);
    if(!state.guided) setTimeout(showGuide, 300);
  };
  watchPair();
}

/* when to sync: on open, every 60 s while visible, when coming back, when the network returns; push on hide */
function cloudTick(){
  if(!accSess() || document.hidden) return;
  cloudSync({prof:true}).then(pollMsgs);
}
function cloudFlush(){
  if(!accSess() || !lsGet('sq.dirty')) return;
  clearTimeout(pushTimer); cloudSync({keepalive:true});
}
document.addEventListener('visibilitychange', () => {if(document.hidden) cloudFlush(); else {cloudTick(); nextMsg();}});
addEventListener('pagehide', cloudFlush);
addEventListener('online', cloudTick);
setInterval(cloudTick, 60000);
setInterval(() => {const el = document.getElementById('accSt'); if(el && acct.st === 'ok') el.innerHTML = stHTML();}, 20000);
if(accSess()) setTimeout(cloudTick, 800);

/* refresh "now" info every 30s; check reminders every 20s */
setInterval(() => {
  if(taskDlg.open || profDlg.open) return;
  if(ui.tab === 'home') refreshHome();
  else if(ui.tab === 'week') render();
}, 30000);
setInterval(checkReminders, 20000);
setTimeout(checkReminders, 1500);

matchMedia('(max-width:760px)').addEventListener('change', render);

save();
render();
preloadChar();
if(needWelcome()) showWelcome(); else if(!state.guided) setTimeout(showGuide, 400);
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
