<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>解压室</title>
<link rel="manifest" href="stress.webmanifest">
<link rel="icon" type="image/png" href="icons/stress-192.png">
<link rel="apple-touch-icon" href="icons/stress-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="解压室">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffd9e4">
<style>
/* Same game room as 学习闯关: a big 3D character standing on a warm floor, candy buttons that sink when pressed.
   Couple mode is a pink room with 安仁; enemy mode is a hot orange room with the boss. */
:root{
  --sky1:#ffd3e1; --sky2:#fff0f5; --floor1:#ffe3bd; --floor2:#ffcf94;
  --sheet:#ffffff; --paper:#fff4f7; --ink:#2b2840; --pencil:#7d7790; --rule:#efe3ea; --shade:rgba(43,40,64,.16);
  --m:#ff5f95; --m-e:#d93d73; --on:#ffffff;
  --sun:#ffc21f; --sun-e:#e59a00; --on-sun:#4a2c00; --go:#36c66b; --go-e:#1f9a4d; --blue:#3b8cff; --blue-e:#2367d4;
  --bubble:#ffffff; --bubble-ink:#2b2840; --scrim:rgba(30,20,40,.55);
  --couple1:#ffd3e1; --couple2:#ff8fb3; --enemy1:#ffd9b8; --enemy2:#ff8a4c;
  --orange:#ff6a2b; --orange-e:#d24b10; --her1:#ffd0d8; --her2:#ff7a8f; --rose:#f0435e; --rose-e:#c42a44; --tag:#ffffff; --tag-ink:#2b2840; --hair:#3a2a20;
  --f-body:ui-rounded,"SF Pro Rounded","PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
body[data-mode="enemy"]{--sky1:#ffc9a6;--sky2:#fff1e4;--paper:#fff3ea;--rule:#f1e2d6;--m:#ff6a2b;--m-e:#d24b10}
body[data-mode="her"]{--sky1:#ffc4cf;--sky2:#fff0f2;--paper:#fff2f4;--rule:#f5dde2;--m:#f0435e;--m-e:#c42a44}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --sky1:#3a1f3f; --sky2:#231a36; --floor1:#4a3360; --floor2:#36264d;
    --sheet:#2c2443; --paper:#231c38; --ink:#f3eefc; --pencil:#b3aacb; --rule:#3e3459; --shade:rgba(0,0,0,.38);
    --m:#ff6f9f; --m-e:#b63a66; --on:#ffffff; --scrim:rgba(0,0,0,.65);
    --couple1:#5a2a4a; --couple2:#a8456f; --enemy1:#5a3424; --enemy2:#b4572a; --orange:#ff7a3d; --orange-e:#b44a16; --her1:#5a2430; --her2:#a83a4f; --rose:#ff5c76; --rose-e:#b0304a;
    color-scheme:dark;
  }
  :root:not([data-theme="light"]) body[data-mode="enemy"]{--sky1:#45261d;--sky2:#261b2c;--paper:#2a1f30;--rule:#4a3540;--m:#ff7a3d;--m-e:#b44a16}
  :root:not([data-theme="light"]) body[data-mode="her"]{--sky1:#47202c;--sky2:#241a30;--paper:#2b1d2e;--rule:#4a3040;--m:#ff5c76;--m-e:#b0304a}
}
:root[data-theme="dark"] body[data-mode="enemy"]{--sky1:#45261d;--sky2:#261b2c;--paper:#2a1f30;--rule:#4a3540;--m:#ff7a3d;--m-e:#b44a16}
:root[data-theme="dark"] body[data-mode="her"]{--sky1:#47202c;--sky2:#241a30;--paper:#2b1d2e;--rule:#4a3040;--m:#ff5c76;--m-e:#b0304a}
:root[data-theme="dark"]{
  --sky1:#3a1f3f; --sky2:#231a36; --floor1:#4a3360; --floor2:#36264d;
  --sheet:#2c2443; --paper:#231c38; --ink:#f3eefc; --pencil:#b3aacb; --rule:#3e3459; --shade:rgba(0,0,0,.38);
  --m:#ff6f9f; --m-e:#b63a66; --on:#ffffff; --scrim:rgba(0,0,0,.65);
  --couple1:#5a2a4a; --couple2:#a8456f; --enemy1:#5a3424; --enemy2:#b4572a; --orange:#ff7a3d; --orange-e:#b44a16; --her1:#5a2430; --her2:#a83a4f; --rose:#ff5c76; --rose-e:#b0304a;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--sky2);background-image:linear-gradient(180deg,var(--sky1),var(--sky2) 70%);background-attachment:fixed;
  color:var(--ink);font:15px/1.45 var(--f-body);min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:10px;min-height:100vh;min-height:100dvh;
  padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}

/* candy buttons */
.c3d{--b:var(--m);--e:var(--m-e);--t:var(--on);background:var(--b);color:var(--t);border-radius:18px;box-shadow:0 5px 0 var(--e);font-weight:900;
  min-height:52px;padding:12px 18px;transition:transform .08s,box-shadow .08s}
.c3d:active{transform:translateY(4px);box-shadow:0 1px 0 var(--e)}
.c3d.sun{--b:var(--sun);--e:var(--sun-e);--t:var(--on-sun)}
.c3d.white{--b:var(--sheet);--e:var(--shade);--t:var(--ink)}
.c3d.wide{display:block;width:100%;font-size:18px}
.round{width:46px;height:46px;border-radius:50%;background:var(--sheet);box-shadow:0 4px 0 var(--shade);display:grid;place-items:center;font-size:20px;font-weight:900;flex:none}
.round:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shade)}

/* home */
.title{text-align:center;padding:18px 0 4px}
.title h1{display:inline-block;margin:0;font-size:38px;line-height:1.1;font-weight:900;background:var(--sheet);padding:8px 22px;border-radius:22px;box-shadow:0 6px 0 var(--shade)}
.title p{margin:14px 0 0;color:var(--pencil);font-weight:700}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.mode{display:flex;flex-direction:column;align-items:stretch;background:var(--sheet);border-radius:26px;overflow:hidden;box-shadow:0 7px 0 var(--shade);text-align:center;transition:transform .08s,box-shadow .08s}
.mode:active{transform:translateY(5px);box-shadow:0 2px 0 var(--shade)}
.mode .pic{height:min(25vh,220px);display:flex;justify-content:center;align-items:flex-end;padding-top:10px;
  background:radial-gradient(130% 30% at 50% 100%,var(--floor2) 0 55%,transparent 56%),linear-gradient(180deg,var(--c1),var(--c2))}
.mode.couple{--c1:var(--couple1);--c2:var(--couple2);--g:var(--m);--ge:var(--m-e)}
.mode.enemy{--c1:var(--enemy1);--c2:var(--enemy2);--g:var(--orange);--ge:var(--orange-e)}
.mode.her{--c1:var(--her1);--c2:var(--her2);--g:var(--rose);--ge:var(--rose-e)}
.mode.wide{grid-column:1/-1;flex-direction:row;text-align:left}
.mode.wide .pic{flex:none;width:38%;max-width:150px;height:150px}
.mode.wide .txt{align-items:flex-start;justify-content:center;padding:12px 14px}
.mode.wide .go{margin-top:0}
.mode .pic img{height:100%;max-width:100%;object-fit:contain;object-position:50% 100%;filter:drop-shadow(0 6px 5px rgba(0,0,0,.18))}
.mode .txt{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 8px 14px}
.mode h2{margin:0;font-size:20px;font-weight:900}
.mode p{margin:4px 0 10px;color:var(--pencil);font-size:13px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.mode .go{display:inline-flex;align-items:center;justify-content:center;margin-top:auto;min-height:44px;padding:0 20px;border-radius:999px;background:var(--g);color:var(--on);font-size:16px;font-weight:900;box-shadow:0 4px 0 var(--ge)}
.homefoot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:10px}
.homefoot a{color:var(--ink);text-decoration:none;font-weight:800;min-height:46px;display:inline-flex;align-items:center;padding:0 16px;background:var(--sheet);border-radius:999px;box-shadow:0 4px 0 var(--shade)}
.pill{min-height:46px;padding:0 16px;border-radius:999px;background:var(--sheet);box-shadow:0 4px 0 var(--shade);font-weight:800;font-size:14px}
.pill:active,.homefoot a:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shade)}
.note{margin:4px 0 0;font-size:12px;color:var(--pencil);text-align:center;font-weight:600}

/* play: top bar with the meter */
.top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--sheet);border-radius:24px;padding:8px;box-shadow:0 5px 0 var(--shade)}
.top .round{box-shadow:none;background:var(--paper)}
.top .nm{display:flex;align-items:center;gap:6px;min-width:0}
.top h1{margin:0;font-size:17px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.goal{flex:none;margin-left:auto;font-size:11px;font-weight:900;color:var(--ink);background:var(--paper);box-shadow:inset 0 0 0 2px var(--m);border-radius:999px;padding:2px 8px;white-space:nowrap}
.meter{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:var(--pencil);margin-top:3px}
.meter .bar{flex:1;height:14px;background:var(--paper);border-radius:999px;overflow:hidden;box-shadow:inset 0 2px 0 var(--shade)}
.meter .bar i{display:block;height:100%;border-radius:999px;background:var(--m);transition:width .4s cubic-bezier(.2,.8,.2,1)}
.meter span{white-space:nowrap}
.meter b{min-width:28px;text-align:right;color:var(--ink);font-size:14px;font-variant-numeric:tabular-nums}
.meter b.bump{animation:bump .35s ease}
@keyframes bump{40%{transform:scale(1.4);color:var(--m)}}
.renamer{display:flex;gap:8px}
.renamer input{flex:1;min-width:0;font:inherit;font-size:16px;font-weight:700;color:var(--ink);background:var(--sheet);border:0;border-radius:16px;padding:10px 14px;box-shadow:0 4px 0 var(--shade)}

/* the room */
.room{position:relative;flex:1;min-height:300px;border-radius:28px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  background:radial-gradient(120% 30% at 50% 100%,var(--floor2) 0 55%,transparent 56%),radial-gradient(150% 36% at 50% 104%,var(--floor1) 0 60%,transparent 61%)}
.room.shake{animation:shk .3s ease}
@keyframes shk{25%{transform:translate(-6px,3px)}50%{transform:translate(6px,-3px)}75%{transform:translate(-3px,2px)}}
.bubble{position:absolute;left:50%;top:8px;transform:translateX(-50%);z-index:4;width:max-content;max-width:min(calc(100% - 124px),340px);background:var(--bubble);color:var(--bubble-ink);
  border-radius:20px;padding:9px 14px;font-weight:800;font-size:15px;line-height:1.35;text-align:center;box-shadow:0 4px 0 var(--shade);animation:pop .3s cubic-bezier(.3,1.5,.5,1)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-9px;border:9px solid transparent;border-bottom:0;border-top-color:var(--bubble)}
@keyframes pop{from{transform:translateX(-50%) scale(.7);opacity:0}}
/* absolutely placed so its height comes from the room (a % height inside a flex item with no fixed height resolves to 0) */
.figwrap{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);height:min(calc(100% - 56px),460px);aspect-ratio:466/760;max-width:100%;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.fig{position:absolute;inset:0;transform-origin:50% 100%}
.fig img{width:100%;height:100%;object-fit:contain;object-position:50% 100%;display:block;pointer-events:none;filter:drop-shadow(0 8px 6px rgba(60,30,10,.2))}
.fig canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.figwrap.drawing canvas{pointer-events:auto}
.mk{position:absolute;font-size:24px;line-height:1;pointer-events:none;transform:translate(-50%,-50%)}
.acc3{position:absolute;left:50%;top:1%;font-size:46px;line-height:1;transform:translateX(-50%) rotate(-8deg);pointer-events:none}
.nametag{position:absolute;left:50%;top:57%;transform:translateX(-50%) rotate(-4deg);background:var(--tag);color:var(--tag-ink);border:3px solid var(--orange);border-radius:10px;
  padding:2px 10px;font-weight:900;font-size:15px;white-space:nowrap;pointer-events:none;box-shadow:0 3px 0 var(--shade)}
.fig.idle{animation:breathe 3s ease-in-out infinite}
.fig.recoil{animation:recoil .45s ease}
.fig.kick{animation:kick .9s cubic-bezier(.2,.7,.3,1)}
.fig.slap{animation:slapA .4s ease}
.fig.wiggle{animation:wiggle .4s ease 3}
.fig.squish{animation:squish .5s ease}
.fig.bounce{animation:bounce .5s ease 2}
.fig.shiver{animation:shiver .08s linear 8}
@keyframes breathe{50%{transform:scale(1.012,.988)}}
@keyframes recoil{20%{transform:scale(1.06,.9) translateX(-10px)}50%{transform:scale(.96,1.05) translateX(6px) rotate(3deg)}80%{transform:rotate(-1deg)}}
@keyframes kick{25%{transform:translate(110%,-30%) rotate(150deg)}45%{transform:translate(150%,-10%) rotate(290deg);opacity:.2}46%{transform:translate(-150%,-10%) rotate(-60deg);opacity:.2}75%{transform:translate(-8%,0) rotate(-6deg);opacity:1}90%{transform:translate(3%,0) rotate(3deg)}}
@keyframes slapA{30%{transform:rotate(-10deg) translateX(-14px)}60%{transform:rotate(4deg)}}
@keyframes wiggle{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
@keyframes squish{30%{transform:scale(1.12,.86)}60%{transform:scale(.95,1.06)}}
@keyframes bounce{50%{transform:translateY(-16px)}}
@keyframes shiver{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.fx{position:absolute;pointer-events:none;font-size:38px;transform:translate(-50%,-50%);animation:fxUp 1s ease-out forwards;z-index:3}
@keyframes fxUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.4)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}100%{opacity:0;transform:translate(-50%,-170%) scale(1)}}
.hairbit{position:absolute;width:20px;height:5px;border-radius:3px;background:var(--hair);pointer-events:none;animation:fall 1.2s ease-in forwards;z-index:3}
@keyframes fall{to{transform:translateY(240px) rotate(260deg);opacity:0}}
/* what to do next: sits at the top of the tray, right under the character */
.hint{display:flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:6px 12px;border-radius:14px;background:var(--paper);
  text-align:center;font-size:14px;font-weight:900;line-height:1.3;color:var(--ink)}
.hint.nudge{animation:wiggle .3s ease 2}
/* small corner buttons inside the room: help on the right, reset + save on the left */
.corner{position:absolute;top:10px;z-index:5;display:flex;flex-direction:column;gap:8px}
.corner.l{left:10px}.corner.r{right:10px}
.corner button{width:44px;height:44px;border-radius:50%;background:var(--sheet);box-shadow:0 3px 0 var(--shade);font-weight:900;font-size:19px;display:grid;place-items:center}
.corner button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shade)}
/* pulsing finger that shows where to tap (or drag, for doodle) */
.tapme{position:absolute;left:56%;top:46%;z-index:3;font-size:42px;line-height:1;pointer-events:none;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25));animation:tapme 1.1s ease-in-out infinite}
.tapme.drag{animation:dragme 1.8s ease-in-out infinite}
@keyframes tapme{0%,100%{transform:translate(-50%,0) scale(1)}50%{transform:translate(-50%,-14px) scale(1.12)}}
@keyframes dragme{0%,100%{transform:translate(-110%,0) rotate(-12deg)}50%{transform:translate(10%,10px) rotate(12deg)}}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;text-align:left;display:flex;flex-direction:column;gap:8px}
.steps li{counter-increment:s;display:flex;gap:10px;align-items:flex-start;font-weight:700;background:var(--paper);border-radius:14px;padding:10px 12px}
.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--m);color:var(--on);display:grid;place-items:center;font-weight:900;font-size:14px}

/* tool tray */
.tray{background:var(--sheet);border-radius:26px;padding:10px 10px 12px;box-shadow:0 6px 0 var(--shade);display:flex;flex-direction:column;gap:10px}
.tools{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 6px}
.tools.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.tool{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:800;color:var(--ink);min-width:0}
.tool b{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:var(--paper);box-shadow:0 4px 0 var(--shade);transition:transform .08s,box-shadow .08s}
.tool:active b{transform:translateY(3px);box-shadow:0 1px 0 var(--shade)}
.tool span{padding:1px 7px;border-radius:999px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tools.five .tool span{padding:1px 2px}
.tool.on b{background:var(--m);box-shadow:0 4px 0 var(--m-e),0 0 0 3px var(--sheet),0 0 0 6px var(--m);transform:scale(1.08)}
.tool.on span{color:var(--on);background:var(--m)}
.foods{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;overscroll-behavior-x:contain}
.foods::-webkit-scrollbar{display:none}
.food{flex:none;width:50px;height:50px;border-radius:50%;background:var(--paper);box-shadow:0 4px 0 var(--shade);font-size:26px;line-height:1}
.food:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shade)}

/* overlays */
.overlay{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:20;animation:fade .25s ease;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
@keyframes fade{from{opacity:0}}
.modal{position:relative;background:var(--sheet);border-radius:28px;padding:22px 18px 18px;width:min(380px,100%);max-height:100%;overflow-y:auto;text-align:center;
  box-shadow:0 8px 0 var(--shade);animation:mpop .35s cubic-bezier(.2,1.4,.4,1);display:flex;flex-direction:column;gap:10px}
@keyframes mpop{from{transform:scale(.85);opacity:.4}}
.modal h2{margin:0;font-size:26px;font-weight:900}
.modal p{margin:0;font-weight:700}
.modal .mini{height:min(30vh,220px);display:flex;justify-content:center}
.modal .mini img{height:100%;filter:drop-shadow(0 6px 6px rgba(0,0,0,.2))}
.modal .shot{display:block;width:auto;max-width:100%;max-height:52vh;margin:0 auto;border-radius:18px;-webkit-touch-callout:default}
.modal a.c3d{text-decoration:none;display:flex;align-items:center;justify-content:center}
.breath{width:150px;height:150px;margin:46px auto;border-radius:50%;background:var(--paper);box-shadow:0 0 0 12px color-mix(in srgb,var(--m) 25%,transparent);
  display:grid;place-items:center;font-size:18px;font-weight:900;transition:transform 4s ease-in-out}
.breath.in{transform:scale(1.4)}
.count{color:var(--pencil);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.him{display:flex;gap:10px;align-items:center;text-align:left;background:var(--paper);border-radius:18px;padding:10px 12px}
.him .av{width:46px;height:46px;border-radius:50%;flex:none;overflow:hidden;background:var(--sheet)}
.him .av img{width:100%;height:auto;transform:scale(1.9) translateY(19%)}
.him small{display:block;font-weight:900;color:var(--m)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--ink);color:var(--sheet);
  padding:10px 16px;border-radius:14px;font-size:14px;font-weight:800;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.show{opacity:1}
@media (max-height:700px){.mode .pic{height:min(21vh,150px)}.mode.wide .pic{height:118px}.mode .txt{padding:8px 8px 10px}.mode .go{min-height:38px}
  .title{padding-top:4px}.title h1{font-size:28px;padding:6px 18px}.title p{margin-top:8px}.modes{gap:10px}
  .tool b{width:46px;height:46px;font-size:23px}.tools{gap:6px}.tray{gap:8px}.room{min-height:250px}.modal .mini{height:min(24vh,170px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="toast"></div>

<script>
const KEY = 'stressRoom.v1';
const FOODS = ['🍰','🍔','🍗','🍜','🧋','🍩','🍕','🍦','🍓','🥟'];

const T = {
  zh:{

/* ---------- sound ---------- */
let AC;
function ac(){
  if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if(AC.state === 'suspended') AC.resume();
  return AC;
}
function noise(dur, freq, gain, type='lowpass', delay=0){
  const a = ac(), n = Math.floor(a.sampleRate*dur), b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/n, 2);
  const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  src.buffer = b; f.type = type; f.frequency.value = freq; g.gain.value = gain;
  src.connect(f); f.connect(g); g.connect(a.destination);
  src.start(a.currentTime + delay);
}
function tone(f0, f1, dur, type='sine', gain=.15, delay=0){
  const a = ac(), o = a.createOscillator(), g = a.createGain(), t = a.currentTime + delay;
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t+dur);
  g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(.001, t+dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+.02);
}
const SFX = {
  punch:() => {noise(.18, 900, .9); tone(170, 55, .18, 'sine', .45);},
  kick:() => {tone(130, 40, .35, 'sine', .55); noise(.25, 600, .6); tone(500, 1400, .5, 'triangle', .06, .15);},
  slap:() => noise(.1, 2500, 1, 'highpass'),
  snip:() => {noise(.035, 6000, .7, 'highpass'); noise(.035, 6000, .7, 'highpass', .1);},
  pie:() => {noise(.3, 380, 1); tone(220, 90, .25, 'sine', .2);},
  water:() => {noise(.7, 1400, .5, 'bandpass'); noise(.4, 3000, .2, 'highpass', .1);},
  tickle:() => [0,1,2,3,4].forEach(i => tone(700+i*70, 950+i*70, .07, 'triangle', .1, i*.08)),
  marker:() => noise(.06, 3500, .15, 'bandpass'),
  eat:() => [0,1,2].forEach(i => {tone(320, 190, .07, 'square', .05, i*.14); noise(.05, 1200, .25, 'lowpass', i*.14);}),
  kiss:() => {tone(900, 1700, .09, 'sine', .22); tone(1200, 2000, .06, 'sine', .12, .1);},

};

function speak(text){

}

    <div class="homefoot"><a href="index.html">${t.studyLink}</a>
      <span style="display:flex;gap:8px"><button class="pill" id="snd" aria-pressed="${store.sound}">${store.sound?'🔊':'🔇'} ${t.sound}</button><button class="pill" id="lang">${t.lang}</button></span></div>`;
  app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => {sfx('pop'); setMode(b.dataset.go); screen = 'play'; startPlay(); render(); if(!store.seen[mode]) showGuide();});
  document.getElementById('lang').onclick = () => {store.lang = store.lang === 'zh' ? 'en' : 'zh'; save(); document.documentElement.lang = store.lang === 'zh' ? 'zh-CN' : 'en'; render();};
  document.getElementById('snd').onclick = () => {store.sound = !store.sound; save(); render();};
}

function startPlay(){
  strokes = [];
  ps = mode === 'enemy'
    ? {expr:'smug', bruises:[], snips:0, bald:false, stress:100, ended:false}
    : {expr:'idle', ...store[lookKey()], love:0, celebrated:false, feeds:0};
  tool = 'punch';
}
function idleExpr(){
  if(loveMode()) return 'idle';
  return ps.bald ? 'bald' : ps.stress > 40 ? 'smug' : 'cry';
}

function renderPlay(){
  const t = tx(), enemy = mode === 'enemy', v = enemy ? ps.stress : ps.love;
  const tray = enemy
    ? `<div class="tools">${ENEMY_TOOLS.map(([k,e]) => `<button class="tool ${tool===k?'on':''}" data-tool="${k}" aria-pressed="${tool===k}"><b>${e}</b><span>${t.tools[k]}</span></button>`).join('')}</div>`
    : `<div class="foods">${FOODS.map(f => `<button class="food" data-food="${f}" aria-label="${f}">${f}</button>`).join('')}</div>
       <div class="tools five">${COUPLE_TOOLS.map(([k,e]) => `<button class="tool" data-ct="${k}"><b>${e}</b><span>${t.ctools[k]}</span></button>`).join('')}</div>`;
  app.innerHTML = `
    <div class="top"><button class="round" id="back" aria-label="${esc(t.home)}">←</button>
      <div style="min-width:0"><div class="nm"><h1>${esc(charName())}</h1><span class="goal">${enemy ? t.stressGoal : t.loveGoal}</span></div>
        <div class="meter"><span>${enemy ? t.stress : t.love}</span><div class="bar"><i id="mbar" style="width:${v}%"></i></div><b id="mval">${v}</b></div></div>
      <button class="round" id="edit" aria-label="${esc(t.rename)}">✏️</button></div>
    <div class="renamer" id="renamer" hidden><input id="nm" maxlength="6" value="${esc(store[NAMEKEY[mode]])}" placeholder="${esc(enemy ? t.namePh : mode === 'her' ? t.herPh : t.himPh)}" aria-label="${esc(t.rename)}"><button class="c3d" id="nmok">${t.ok}</button></div>
    <div class="room" id="stage">
      <div class="bubble" id="say">${esc(pick(lines().idle))}</div>
      <div class="figwrap ${enemy && tool==='marker'?'drawing':''}" id="figwrap">
        <div class="fig idle" id="fig"><img id="figimg" src="${poseSrc()}" alt=""><div id="marks">${marksHTML()}</div><canvas id="cv"></canvas></div>
        <span class="tapme" id="tapme" hidden>👆</span>
      </div>
      <div class="corner l"><button id="reset" aria-label="${esc(t.reset)}" title="${esc(t.reset)}">↺</button><button id="savepic" aria-label="${esc(t.save)}" title="${esc(t.save)}">📷</button></div>
      <div class="corner r"><button id="help" aria-label="${esc(t.help)}" title="${esc(t.help)}">?</button></div>
    </div>
    <div class="tray"><div class="hint" id="hint" aria-live="polite"></div>${tray}</div>`;
  document.getElementById('back').onclick = () => {screen = 'home'; render();};
  document.getElementById('edit').onclick = () => {const r = document.getElementById('renamer'); r.hidden = !r.hidden; if(!r.hidden) document.getElementById('nm').focus();};
  const nmok = document.getElementById('nmok');
  nmok.onclick = () => {store[NAMEKEY[mode]] = document.getElementById('nm').value; save(); renderPlay();};
  document.getElementById('nm').onkeydown = e => {if(e.key === 'Enter') nmok.click();};
  document.getElementById('reset').onclick = () => {
    if(loveMode()){store[lookKey()] = defaults()[lookKey()]; save();}
    startPlay(); render(); sfx('pop'); toast(t.resetDone);
  };
  document.getElementById('savepic').onclick = savePicture;
  document.getElementById('help').onclick = showGuide;
  app.querySelectorAll('[data-tool]').forEach(b => b.onclick = () => {
    tool = b.dataset.tool; sfx('pop');
    app.querySelectorAll('[data-tool]').forEach(x => {x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', x === b);});
    document.getElementById('figwrap').classList.toggle('drawing', tool === 'marker');
    if(['kick','pie','water'].includes(tool)) enemyAct(tool, 50, 40); // these fire right away
    toolHint(); showTap();
  });
  app.querySelectorAll('[data-food]').forEach(b => b.onclick = () => coupleAct('feed', b.dataset.food));
  app.querySelectorAll('[data-ct]').forEach(b => b.onclick = () => coupleAct(b.dataset.ct));
  setupStage();
  if(enemy){toolHint(); if(!ps.hits) showTap();} else setHint('👇', fill(t.feedHint));
}
// the line at the top of the tray always says what to do next
function setHint(ico, text, nudge){
  const h = document.getElementById('hint');
  if(!h) return;
  h.innerHTML = `<span aria-hidden="true">${ico}</span><span>${esc(text)}</span>`;
  if(nudge){h.classList.remove('nudge'); void h.offsetWidth; h.classList.add('nudge');}
}
function toolHint(){
  const t = tx(), e = ENEMY_TOOLS.find(x => x[0] === tool)[1];
  if(tool === 'snip' && ps.bald) return setHint(e, t.baldHint);
  setHint(e, t.tools[tool] + (store.lang === 'zh' ? '：' : ': ') + fill(t.hints[tool]));
}
// pulsing finger over him; for doodle it swipes to show "drag"
function showTap(on = true){
  const f = document.getElementById('tapme');
  if(!f) return;
  f.hidden = !on || mode !== 'enemy' || ps.ended;
  f.classList.toggle('drag', tool === 'marker');
}

/* ---------- stage interaction ---------- */
function boxPoint(e){
  const r = document.getElementById('fig').getBoundingClientRect();
  return {x:(e.clientX - r.left)/r.width*100, y:(e.clientY - r.top)/r.height*100};
}
function setupStage(){
  const wrap = document.getElementById('figwrap'), cv = document.getElementById('cv');
  const fit = () => {const r = cv.getBoundingClientRect(), d = devicePixelRatio || 1; cv.width = r.width*d; cv.height = r.height*d; redrawStrokes();};
  fit();
  let drawing = null;
  wrap.onpointerdown = e => {
    const p = boxPoint(e);
    if(mode === 'enemy' && tool === 'marker'){
      drawing = {pts:[p], color:pick(['#1f1f2a','#e63946','#2b6cff','#18a058'])};
      strokes.push(drawing); wrap.setPointerCapture(e.pointerId); showTap(false); return;
    }
    if(mode === 'enemy') enemyAct(tool, p.x, p.y);
    else coupleAct('squish');
  };
  wrap.onpointermove = e => {
    if(!drawing) return;
    drawing.pts.push(boxPoint(e)); redrawStrokes();
  };
  wrap.onpointerup = wrap.onpointercancel = () => {
    if(drawing && drawing.pts.length > 3){sfx('marker'); enemyAct('marker');}
    else if(drawing){strokes.pop(); redrawStrokes(); setHint('🖊️', tx().dragMore, true); showTap();}
    drawing = null;
  };
  window.onresize = fit;
}
function drawStrokes(ctx, x0, y0, w, h){
  ctx.lineCap = ctx.lineJoin = 'round';
  for(const s of strokes){
    ctx.strokeStyle = s.color; ctx.lineWidth = Math.max(3, w/60);
    ctx.beginPath();
    s.pts.forEach((p,i) => ctx[i?'lineTo':'moveTo'](x0 + p.x/100*w, y0 + p.y/100*h));
    ctx.stroke();
  }
}
function redrawStrokes(){
  const cv = document.getElementById('cv');
  if(!cv) return;
  const ctx = cv.getContext('2d');
  ctx.clearRect(0,0,cv.width,cv.height);
  drawStrokes(ctx, 0, 0, cv.width, cv.height);
}
function fx(emoji, x, y, n=1){
  const wrap = document.getElementById('figwrap');
  if(!wrap) return;
  for(let i=0;i<n;i++){
    const s = document.createElement('span');
    s.className = 'fx'; s.textContent = emoji;
    s.style.left = (x + (Math.random()-.5)*(n>1?40:0)) + '%';
    s.style.top = (y + (Math.random()-.5)*(n>1?20:0)) + '%';
    s.style.animationDelay = (i*.1) + 's';
    wrap.appendChild(s);
    setTimeout(() => s.remove(), 1200 + i*100);
  }
}
function hairBits(n=5){
  const wrap = document.getElementById('figwrap');
  for(let i=0;i<n;i++){
    const s = document.createElement('span');
    s.className = 'hairbit';
    s.style.left = (32 + Math.random()*36) + '%'; s.style.top = (4 + Math.random()*10) + '%';
    s.style.transform = `rotate(${Math.random()*180}deg)`;
    wrap.appendChild(s);
    setTimeout(() => s.remove(), 1300);
  }
}
function animate(cls){
  const f = document.getElementById('fig');
  f.className = 'fig'; void f.offsetWidth; f.className = 'fig ' + cls;
  clearTimeout(busy);
  busy = setTimeout(() => {const g = document.getElementById('fig'); if(g) g.className = 'fig idle';}, cls === 'kick' ? 950 : 700);
}
function redraw(){
  const img = document.getElementById('figimg'), m = document.getElementById('marks');
  if(img) img.src = poseSrc();
  if(m) m.innerHTML = marksHTML();
}
function say(text){
  const b = document.getElementById('say');
  if(!b) return;
  b.textContent = text;
  b.style.animation = 'none'; void b.offsetWidth; b.style.animation = '';
  speak(text);
}
function setMeter(v){
  const bar = document.getElementById('mbar'), val = document.getElementById('mval');
  if(bar) bar.style.width = v + '%';
  if(val){val.textContent = v; val.classList.remove('bump'); void val.offsetWidth; val.classList.add('bump');}
}
let exprTimer;
function setExpr(e, ms=1900){
  // once the boss is bald he stays bald (only the pie picture hides his head)
  ps.expr = mode === 'enemy' && ps.bald && e !== 'pie' ? 'bald' : e; redraw();
  clearTimeout(exprTimer);
  exprTimer = setTimeout(() => {ps.expr = idleExpr(); redraw();}, ms);
}

function enemyAct(k, x=50, y=40){
  if(ps.ended) return;
  const L = lines();
  ps.hits = (ps.hits || 0) + 1; showTap(false);
  const cost = (ENEMY_TOOLS.find(t => t[0] === k) || [0,0,3])[2];
  const stage = document.getElementById('stage');
  switch(k){
    case 'punch':
      if(ps.bruises.length < 10) ps.bruises.push({x:Math.max(22,Math.min(78,x)), y:Math.max(12,Math.min(70,y))});
      setExpr('hurt'); animate('recoil'); fx(pick(['💥','💢','⭐']), x, y); say(pick(L.punch)); sfx('punch');
      stage.classList.remove('shake'); void stage.offsetWidth; stage.classList.add('shake'); break;
    case 'kick':
      setExpr('dizzy', 2400); animate('kick'); setTimeout(() => fx('💫', 50, 12, 3), 800); say(pick(L.kick)); sfx('kick'); break;
    case 'slap':
      setExpr('slapped'); animate('slap'); fx('👋', x < 50 ? 30 : 70, 28); say(pick(L.slap)); sfx('slap'); break;
    case 'snip':
      if(ps.bald){setExpr('cry'); say(pick(L.bald)); sfx('snip'); setHint('✂️', tx().baldHint, true); return;}
      ps.snips++; hairBits(); fx('✂️', x, Math.min(y, 15)); sfx('snip');
      if(ps.snips >= 3){ps.bald = true; setExpr('bald', 2600); say(pick(L.snip)); setHint('✂️', tx().baldHint);}
      else {setExpr('cry'); say(pick(L.snip));}
      break;
    case 'marker':
      setExpr('cry'); say(pick(L.marker)); break;
    case 'pie':
      setExpr('pie', 3200); animate('recoil'); fx('🥧', 50, 20); say(pick(L.pie)); sfx('pie'); break;
    case 'water':
      setExpr('wet', 3200); animate('shiver'); fx('💧', 50, 15, 5); say(pick(L.water)); sfx('water'); break;
    case 'tickle':
      setExpr('laugh'); animate('wiggle'); fx(pick(['🤣','😂']), x, y); say(pick(L.tickle)); sfx('tickle'); break;
  }
  ps.stress = Math.max(0, ps.stress - cost);
  setMeter(ps.stress);
  if(ps.stress > 0 && ps.stress <= 20 && !(k === 'snip' && ps.bald)) setHint('🔥', tx().almost);
  if(ps.stress === 0 && !ps.ended){ps.ended = true; const p = ps; setTimeout(() => ps === p && showEnding(), 1300);}
}

function coupleAct(k, food){
  const L = lines(), l = store[lookKey()];
  let gain = 5, line;
  switch(k){
    case 'feed':
      if(l.fat >= 6){line = pick(L.full); setExpr('idle'); animate('bounce'); break;}
      ps.feeds++; if(ps.feeds % 2 === 0){l.fat++; animate('squish');} else animate('bounce');
      line = l.fat >= 3 && ps.feeds % 2 === 0 ? pick(L.fat) : pick(L.feed);
      setExpr('eat'); fx(food, 50, 30); setTimeout(() => fx('😋', 68, 18), 500); sfx('eat'); break;
    case 'acc': l.acc = (l.acc + 1) % ACCS.length; line = pick(l.acc ? L.acc : L.accOff); setExpr(mode === 'her' ? 'happy' : 'love'); animate('bounce'); sfx('pop'); break;
    case 'hug': line = pick(L.hug); setExpr('love'); animate('squish'); fx('💕', 50, 35, 4); sfx('love'); gain = 8; break;
    case 'kiss':
      if(l.kisses.length < 8){const side = Math.random() < .5 ? -1 : 1; l.kisses.push({x:50 + side*(10 + Math.random()*6), y:27 + Math.random()*6, r:Math.round((Math.random()-.5)*40)});}
      line = pick(L.kiss); setExpr('kiss'); animate('wiggle'); fx('💋', 50, 26); sfx('kiss'); gain = 8; break;
    case 'squish': line = pick(L.squish); setExpr('hurt', 1300); animate('squish'); fx('🤏', 50, 26); sfx('pop'); gain = 3; break;
    case 'diet':
      if(l.fat <= 0){line = pick(L.thin); setExpr('idle'); break;}
      l.fat--; line = pick(L.diet); setExpr('sorry'); animate('bounce'); fx('💦', 66, 16); sfx('pop'); break;
  }
  Object.assign(ps, {fat:l.fat, acc:l.acc, kisses:l.kisses});
  save(); redraw();
  if(line) say(line);
  ps.love = Math.min(100, ps.love + gain);
  setMeter(ps.love);
  if(ps.love >= 80 && ps.love < 100) setHint('💗', tx().loveAlmost);
  if(ps.love >= 100 && !ps.celebrated){ps.celebrated = true; const p = ps; setTimeout(() => ps === p && screen === 'play' && showLoveFull(), 900);}
}

/* ---------- first-time guide ---------- */
function showGuide(){
  const t = tx(), steps = mode === 'enemy' ? t.howEnemy : mode === 'her' ? t.howHer : t.howCouple;
  const o = overlay(`<h2>${t.howTitle}</h2>
    <div class="mini"><img src="${mode === 'enemy' ? 'img/boss/smug.webp' : mode === 'her' ? 'img/xiaochun/happy.webp' : 'img/anren/happy.webp'}" alt=""></div>
    <ol class="steps">${steps.map(x => `<li>${esc(fill(x))}</li>`).join('')}</ol>
    <button class="c3d wide" id="gok">${t.go}</button>`);
  o.querySelector('#gok').onclick = () => {o.remove(); store.seen[mode] = 1; save(); sfx('pop');};
}

/* ---------- endings ---------- */
function overlay(html){
  const o = document.createElement('div');
  o.className = 'overlay'; o.innerHTML = `<div class="modal">${html}</div>`;
  document.body.appendChild(o);
  return o;
}
function himNote(text){
  return `<div class="him"><span class="av"><img src="img/anren/blush.webp" alt=""></span><div><small>${esc(himName())}</small>${esc(text)}</div></div>`;
}
function showEnding(){
  if(screen !== 'play' || mode !== 'enemy') return;
  const t = tx();
  clearTimeout(exprTimer); ps.expr = 'sorry'; redraw();
  const line = pick(lines().sorry);
  speak(line); sfx('win');
  const o = overlay(`<h2>${t.endTitle}</h2>
    <div class="mini"><img src="img/boss/sorry.webp" alt=""></div>
    <p>${esc(enemyName())}${store.lang === 'zh' ? '：' : ': '}${esc(line)}</p>
    <button class="c3d wide" id="br">${t.breathe}</button>
    <button class="c3d white wide" id="ag">${t.again}</button><button class="c3d white wide" id="hm">${t.home}</button>`);
  o.querySelector('#ag').onclick = () => {o.remove(); startPlay(); render();};
  o.querySelector('#hm').onclick = () => {o.remove(); screen = 'home'; render();};
  o.querySelector('#br').onclick = () => {o.remove(); breathing();};
}
function breathing(){
  const t = tx();
  const o = overlay(`<h2>${t.breathTitle}</h2><p class="count">${t.breathHow}</p><div class="breath" id="bc">${t.inhale}</div><div class="count" id="cnt">30${t.left}</div>
    <button class="c3d white wide" id="skip">${t.skip}</button>`);
  const bc = o.querySelector('#bc'), cnt = o.querySelector('#cnt');
  let sec = 30, phase = 0;
  const step = () => {
    phase = 1 - phase;
    bc.classList.toggle('in', phase === 1);
    bc.textContent = phase === 1 ? t.inhale : t.exhale;
  };
  requestAnimationFrame(() => step());
  const phaseT = setInterval(step, 4000);
  const done = () => {
    clearInterval(tick); clearInterval(phaseT);
    o.querySelector('.modal').innerHTML = `<h2>${t.doneTitle}</h2>${himNote(t.breatheDone)}
      <button class="c3d wide" id="ag">${t.again}</button><button class="c3d white wide" id="hm">${t.home}</button>`;
    o.querySelector('#ag').onclick = () => {o.remove(); startPlay(); render();};
    o.querySelector('#hm').onclick = () => {o.remove(); screen = 'home'; render();};
  };
  const tick = setInterval(() => {sec--; cnt.textContent = sec + t.left; if(sec <= 0) done();}, 1000);
  o.querySelector('#skip').onclick = done;
}
function showLoveFull(){
  const t = tx();
  sfx('win');
  const o = overlay(`<h2>${t.loveFull}</h2>
    <div class="mini"><img src="img/${mode === 'her' ? 'xiaochun' : 'anren'}/kiss.webp" alt=""></div>
    <p>${esc(fill(mode === 'her' ? t.herFullSub : t.loveFullSub))}</p>
    <button class="c3d wide" id="sv">${t.save}</button><button class="c3d white wide" id="kp">${t.keep}</button>`);
  o.querySelector('#sv').onclick = () => {savePicture(); o.remove();};
  o.querySelector('#kp').onclick = () => o.remove();
}

/* ---------- save picture: the room as a PNG ---------- */
function savePicture(){
  const W = 600, H = 800, cs = getComputedStyle(document.body);
  const img = new Image();
  img.onload = () => {
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, cs.getPropertyValue('--sky1').trim()); g.addColorStop(1, cs.getPropertyValue('--sky2').trim());
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = cs.getPropertyValue('--floor2').trim();
    ctx.beginPath(); ctx.ellipse(W/2, H, W*.7, 120, 0, 0, Math.PI*2); ctx.fill();
    // picture box with the same 466:760 shape as on screen
    const bh = H - 70, bw = bh*466/760, bx = (W-bw)/2, by = 40;
    ctx.drawImage(img, bx, by, bw, bh);
    const emoji = (ch, x, y, size, rot=0) => {
      ctx.save(); ctx.translate(bx + x/100*bw, by + y/100*bh); ctx.rotate(rot*Math.PI/180);
      ctx.font = `${size}px "Apple Color Emoji","Segoe UI Emoji",sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(ch, 0, 0); ctx.restore();
    };
    if(loveMode()){
      for(const k of ps.kisses || []) emoji('💋', k.x, k.y, 34, k.r);
      if(ACC_EMOJI[ACCS[ps.acc]]) emoji(ACC_EMOJI[ACCS[ps.acc]], 50, 5, 70, -8);
    } else {
      for(const b of ps.bruises) emoji('🩹', b.x, b.y, 36);
      if(ps.expr !== 'pie'){
        ctx.save(); ctx.translate(bx + bw/2, by + .6*bh); ctx.rotate(-4*Math.PI/180);
        ctx.font = '900 26px ui-rounded,"PingFang SC",sans-serif'; const tw = ctx.measureText(enemyName()).width + 28;
        ctx.fillStyle = '#fff'; ctx.strokeStyle = '#ff6a2b'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-tw/2, -20, tw, 40, 10) : ctx.rect(-tw/2, -20, tw, 40); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#2b2840'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(enemyName(), 0, 1); ctx.restore();
      }
    }
    drawStrokes(ctx, bx, by, bw, bh);
    ctx.fillStyle = 'rgba(43,40,64,.55)'; ctx.font = '700 22px ui-rounded,"PingFang SC",sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(tx().appTitle, W - 20, H - 20);
    // a home-screen app on iPhone can't download files, so show the picture: press and hold saves it, Share opens the share sheet
    cv.toBlob(b => {
      if(!b) return;
      const t = tx(), url = URL.createObjectURL(b), file = new File([b], `stress-room-${mode}.png`, {type:'image/png'});
      const canShare = !!(navigator.canShare && navigator.canShare({files:[file]}));
      const o = overlay(`<p class="count">${t.saveHint}</p><img class="shot" src="${url}" alt="">
        ${canShare ? `<button class="c3d wide" id="shr">${t.share}</button>` : `<a class="c3d wide" id="dl" href="${url}" download="${file.name}">${t.save}</a>`}
        <button class="c3d white wide" id="cl">${t.close}</button>`);
      const shr = o.querySelector('#shr');
      if(shr) shr.onclick = () => navigator.share({files:[file]}).catch(() => {});
      o.querySelector('#cl').onclick = () => {o.remove(); URL.revokeObjectURL(url);};
    }, 'image/png');
  };
  img.src = poseSrc();
}
let toastT;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2000);
}

function render(){
  window.scrollTo(0,0);
  if(screen === 'home') renderHome();
  else renderPlay();
}
document.documentElement.lang = store.lang === 'zh' ? 'zh-CN' : 'en';
render();
preload();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
